[workspace]
resolver = "2"
members = [
    "crates/sim-core",
    "crates/sim-data",
    "crates/sim-server",
    # A normal workspace member, not an excluded one: `wasm-bindgen`-dependent crates
    # build for the host target fine, so `sim-wasm` stays inside `cargo test
    # --workspace` and `clippy --all-targets` and cannot rot. What is *not* in the
    # gates is `wasm-pack build` — that needs a toolchain the Rust test run has no
    # business invoking, and its output is an uncommitted build artifact.
    "crates/sim-wasm",
    # In for the same reason `sim-wasm` is, and the reasoning transferred only after it
    # was measured rather than assumed: a gdext crate compiles and host-tests for the
    # host target with **no Godot process running and no Godot binary at build time**
    # (with `api-4-7`; `api-custom` would need one). So `crates/sim-godot/src/driver.rs`
    # — which is the whole of this adapter's behaviour, with no `godot` type in any
    # signature — stays inside `cargo test --workspace` and `clippy --all-targets` and
    # cannot rot.
    #
    # The cost is honest and one-time: ~1m45s of cold build for `godot-codegen` ->
    # `godot-core` -> `godot`, then nothing (0.05 s for a warm no-op clippy). Everyone
    # who clones the repo pays it, including someone who only cares about `sim-core`.
    # Accepted, because a crate outside the gates is a crate that rots.
    #
    # What is *not* in the gates is the Godot-driven exit gate in
    # `crates/sim-godot/tests/` — that needs a built cdylib and a Godot 4.7 binary, which
    # the Rust test run has no business requiring. It is `#[ignore]`d, so it is still
    # compiled by the default gate and cannot rot either; run it with
    # `cargo test -p sim-godot -- --ignored`. Same shape as the `wasm-pack` carve-out
    # above.
    "crates/sim-godot",
]

# The remaining adapter crate (sim-py) is added in its respective phase — see
# CLAUDE.md "Phased build plan".

[workspace.package]
edition = "2021"
# Boyko Non-Commercial License v1.0 (BNCL-1.0) — non-commercial use only; not an
# OSI/SPDX license, so use license-file rather than the `license` SPDX field.
license-file = "LICENSE"
publish = false
repository = "https://github.com/BoykoNeov/batsim"
rust-version = "1.94"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
# `float_roundtrip` is NOT optional and is the reason this lives at the workspace
# level: serde_json's default float parser is not correctly rounded, and its fast
# path can return a value one ULP off the one ryu wrote. Measured on this engine —
# a snapshot round-trip changed `v_rc` in the last bit and the continued trajectory
# stopped being bit-identical. Every crate that parses engine floats out of JSON
# (sim-server, sim-wasm, and any test client) inherits the feature from here so a
# later crate cannot quietly forget it. See docs/plans/phase-4-server-wasm.md.
serde_json = { version = "1", features = ["float_roundtrip"] }
toml = "0.8"
rand_chacha = { version = "0.3", features = ["serde1"] }
rand_core = "0.6"
bitflags = { version = "2", features = ["serde"] }
thiserror = "2"

[profile.release]
lto = true
codegen-units = 1
