The sentence prints the instant itself, so `states = "same"` and `spells` carries it —
which makes the tolerance `tighter` rather than `grid`: a whole second is what "3111"
licenses and half a step at dt = 0.5 is a quarter of that. A flag lands on a step or a
whole one away, so the grid is the only bound with meaning here.
"""

[[claim]]
step = "what-protection-costs"
literal = "then `OV` at 3986 s"
quantity = "flag_first_s:OV"
value = 3986.0
tol = 0.25
tol_from = "tighter"
states = "same"
spells = "3986"
read_at_s = 3986.0
note = """
The trip that ends the charge, 875 s after the balancer started work. Both instants are
claimed rather than one, because the gap between them is the sentence's argument: the
balancer had fourteen minutes and did not close an 11 mV spread.

That gap is not itself claimed — the prose prints no number for it — so it is arithmetic a
reader does and this file does not check.
"""

[[claim]]
