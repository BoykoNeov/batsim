# --- step 11: what the protection costs ----------------------------------------------
#
# THE STEP IS LEDGERED NOW — 14 claims on four arms, and the step is the eleventh lesson:
# the first place on the page where the BMS does something a reader can watch. Its prose
# runs on two trajectories the step does not configure — the same pack with protection off,
# and the same pack asked for twice the current. The two cold arms below were here before
# the scan; the two above it are what the scan needed.
#
# THE HEADLINE IS A SUBTRACTION BETWEEN TWO ARMS. "Those 4.6 points are what protection
# costs" prints neither operand, so it is tied in the vocabulary as the difference of two
# claims quoted by address — which is why the two charge-level claims carry instant tags
# they would not otherwise need.

[[arm]]
step = "what-protection-costs"
name = "unprotected"
instruction = "Then run it again with the BMS unchecked, and compare where the two stop. The unprotected charge outlives this step's mark — it is still pushing 2.1 A at 4100 s — so press Run again when the mark passes and let it finish."
start = "restart"
bms = false
actions = [
  { do = "run", to_s = 4100.0 },
  { do = "run", to_s = 5200.0 },
]
note = """
THE COMPARISON THE STEP IS NAMED FOR. Everything this step calls "what protection costs" is
a subtraction between this arm and the step's own run, and until it existed the two numbers
either side of that subtraction were tied to nothing.

`restart` because the page's BMS checkbox clicks Reset — the same reason the cold arm with
the box cleared gives. TWO run actions rather than one, and they are the sentence: the mark
stops the page at 4100 s and the reader is told in so many words to "press Run again when
the mark passes and let it finish". A single `run` to 5200 would be a trajectory nobody is
instructed to produce, and the two are not the same thing to the harness even where they
are to the engine.

5200 s is 380 s past the last thing claimed here and 1100 past the mark. The charge is over
well before it: the current crosses the 0.3 A cutoff at 4817.5 s and the page stops inside
the window that closes at 4820. What the extra stretch buys is that "reachable" is not a
statement about how far this file chose to run — see the note on `cccv_window_close_s`,
which needs a crossing to exist inside `rows` at all.

The instruction is the whole two-sentence span, ASCII-minus normalised, because the second
sentence is what licenses running past the mark and the first is what names the checkbox.
"""

[[arm]]
step = "what-protection-costs"
name = "one C"
instruction = "ask for 6 A and the BMS derates it to exactly 4.2 A"
start = "restart"
cc_cv_a = 6.0
actions = [{ do = "run", to_s = 4100.0 }]
note = """
THE FIRST ARM IN THIS FILE THAT TYPES INTO THE CC-CV GROUP rather than the simple demand
box, and the field it sets is new for it. The two boxes are different controls: `demand_a`
is discharge-positive and replaces the whole program, so a `demand_a = 6` here would have
run a 6 A DISCHARGE under a sentence about a charge — green arithmetic on the wrong
trajectory. See `Arm::cc_cv_a`.

6 A is 1.0 C of this pack (3.0 Ah x 2 in parallel) where the step asks for 0.5 C, which is
why the sentence says "ask for 6 A" and not "ask for more".

`restart`: typing in the box rebuilds nothing, so the trajectory is the one Restart gives —
a fresh pack at t = 0 with the controls as the reader left them. Same reasoning as the cold
arm one entry down, which drags a slider instead.

Runs to the step's own mark rather than to a length invented here, and the derate is
immediate: `OC` is raised on the very first step and `i_actual` is 4.2 A from 0.5 s onward.
Nothing else claimed here needs the distance — it is run to the mark so that "it derates it"
is a statement about the run and not about its first frame.
"""

