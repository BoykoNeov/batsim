The reading is robust across that bound: the page could stop anywhere from the 4817.5 s
crossing to 4820, and the pack reads 99.5 % across the whole of it (99.5197 % at the
crossing, 99.5223 % here). So the sentence's number does not depend on the frame schedule
even though the instant it is read at is the only end of the interval that is a fact about
the simulation.
"""

[[claim]]
step = "what-protection-costs"
literal = "and the charge ends by 4820 s"
quantity = "cccv_window_close_s"
arm = "unprotected"
value = 4820.0
tol = 0.25
tol_from = "tighter"
states = "same"
spells = "4820"
read_at_s = 4820.0
note = """
A BOUND, AND THE SENTENCE SAYS SO. This used to read "which it reaches at 4820 s", and
neither half of that was checkable. The pack passes 99.5 % well before 4820, and the page's
own stopping instant is not a function of the simulation at all: `ccCvDone` is evaluated at
the end of each chopped chunk, a chunk ends at a decision boundary OR wherever the frame's
step budget ran out, and the budget comes from wall-clock elapsed time. The current crosses
the 0.3 A cutoff at 4817.5 s, so the reader is told somewhere in (4817.5, 4820] and only the
