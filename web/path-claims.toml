"EXACTLY" IS THE ASSERTION, so this is a claim and not a product. 4.2 A is arithmetically
`max_charge_c` x `capacity_ah` x `parallel`, and a rule tying it to those three would have
covered the digit while checking nothing about the BMS — the sentence is not about what
0.7 C comes to, it is about the derate landing on it. The 0.7 in the same sentence IS that
constant and is tied to the chemistry file, which is the half of this that is a lookup.

`magnitude` for `i_at`'s sign, as on the unprotected arm above.

`tighter`, at a hundredth of what "4.2" licenses, and the word "exactly" is the licence:
the derate is a rating multiplied out, not a controller settling, so the engine returns
4.20000 A and a claim allowing it to be 4.24 would not be checking what the sentence says.
This is the one claim in the file whose tolerance is set by an adverb.

READ AT THE FIRST STEP, which is where the sentence says to look: "`OC` raised from the
first step". The derate is flat at 4.20000 A from 0.5 s onward because the limit is a rating
and not a controller — but it is not flat to the mark, and a first draft of this claim read
4100 s and found zero. At 1.0 C this pack trips `OV` at 2729 s, an hour earlier than the
0.5 C run the step itself watches, so by the mark the charge is long over. The arm still
runs to the mark: what it shows past this reading is that asking for more current buys a
SHORTER charge, which is the sentence's implication and which no number in the prose states.

`OC` itself is raised on that same first step, which the sentence also says and which
nothing here claims — a flag with no number in the prose has nothing for a claim to state.
"""

# --- step 11's cold arms: the charge the protection stops, and what stops nothing ----
#
# The first arms in this file that drag the ambient slider, and they exist because of what
# the sentence they follow asserts: two flags "at the same instant". No mechanism here
# compares one arm against another — `identical_to` compares end states, not arrivals — so
# the equality is asserted the only way this file can assert it, by two claims on two arms
# pinning the SAME number. Move either arrival and one of them reddens.

[[arm]]
step = "what-protection-costs"
name = "cold"
instruction = "drag the ambient to −5 °C and watch the pack cool until `UT` inhibits the charge at 60.8 %, then switch the BMS off and see `PLATING_RISK` at the same instant"
start = "restart"
ambient_c = -5.0
actions = [{ do = "run", to_s = 4100.0 }]
note = """
`restart` rather than `mark`, and the label is slightly wider than the button: what a
reader does here is drag the slider and then press **Run**, on the pack the step just
built. That is the same trajectory the Restart button gives — a fresh pack at t = 0 with
the controls left as the reader set them — because `applyStep` has already reloaded this
scenario and `$("ambient").oninput` rebuilds nothing. The mark-side reading is not
available: at 4100 s the protected charge has already stopped at 94.9 %, so a slider
dragged there could never show a pack inhibited at 60.8 %.

Runs to 4100 s, which is the step's own mark rather than a length invented here. The arm is
this step's run under a different slider, and it carries on for 2600 s past its furthest
claim — long enough that "reachable" is not a statement about how far the harness chose to
go. Nothing else arrives in that stretch: the current is zero from the inhibit onwards and
the pack simply keeps cooling, 273.145 K at the flag to 268.297 K at the mark.
"""

[[arm]]
step = "what-protection-costs"
name = "cold, protection off"
instruction = "drag the ambient to −5 °C and watch the pack cool until `UT` inhibits the charge at 60.8 %, then switch the BMS off and see `PLATING_RISK` at the same instant"
start = "restart"
ambient_c = -5.0
bms = false
actions = [{ do = "run", to_s = 4100.0 }]
note = """
The same cold pack with the checkbox cleared, which is the second half of the sentence.
Both overrides are anchored in it — the −5 as a number, the BMS by name — and both are
genuine changes from what the step configures (25 °C, protection on).

`restart` is forced here for a second reason on top of the ambient's: the page's BMS
checkbox clicks Reset, so a mid-run toggle is not a thing the page can do at all.

What this arm shows past its claim is the sentence's last clause, "with the charge carrying
on regardless": the current stays at the full −3 A through the flag and the pack reaches
95.7 % by the mark, where the protected arm stopped dead at 60.75 %. No claim reads it —
the prose gives no number for it — so it is recorded here rather than asserted.
"""

[[claim]]
step = "what-protection-costs"
literal = "watch the pack cool until `UT` inhibits the charge"
quantity = "flag_first_s:UT"
arm = "cold"
value = 1494.5
tol = 0.25
tol_from = "grid"
states = "nothing"
read_at_s = 1494.5
note = """
When the cold reaches the BMS. `UT` is the charge inhibit below `t_charge_min_k`, and the
pack takes twenty-five minutes of simulated time to cool from 25 °C into it — which is why
the sentence tells the reader to *watch* rather than to look.

`nothing`, because the sentence prints no number about this instant, and the variant is
checked rather than declared: the literal has to contain no digit at all, which this one
does not. `grid` for the tolerance, half a step at dt = 0.5 — the engine hits the claimed
step or misses by a whole one.

Its twin on the unprotected arm is pinned to this same 1494.5, which is the whole of "at
the same instant". See that claim.
"""

[[claim]]
step = "what-protection-costs"
literal = "inhibits the charge at 60.8 %"
quantity = "soc_at"
arm = "cold"
value = 0.607528726
tol = 5e-4
tol_from = "spelled"
spells = "60.8"
spells_pow10 = 2
states = "same"
read_at_s = 1494.5
display = "soc (true)"
shows = "60.8 %"
quoted = true
note = """
Where the inhibit catches it. The pack is charging the whole time it is cooling, so the
number is not a property of the protection alone — it is where these two races meet, and it
would move if the charge current or the thermal mass did.

THIS SENTENCE IS 94 % OF THE WAY THROUGH ITS OWN ROUNDING, and that is worth knowing rather
than discovering. The engine says 60.7529 % and the sentence says 60.8, so the stated check
is using 4.71e-4 of the 5e-4 that one decimal licenses. A drift of three parts in ten
thousand downward and the sentence should read 60.7. The margin is thin because the true
value sits just past the .75 boundary, not because anything is wrong.

The same number is written into a code comment in `web/app.js` — `ccCvDone`'s doc cites "a
BMS charge inhibit takes the current to zero at whatever SOC the pack happened to have
reached — measured at 60.8 % on `cc_cv_charge_pack.toml` cooled to −5 °C". That comment is
prose about the same measurement and nothing checks it; this claim covers the sentence a
reader is shown, not the comment.
"""

[[claim]]
step = "what-protection-costs"
literal = "then switch the BMS off and see `PLATING_RISK` at the same instant"
quantity = "flag_first_s:PLATING_RISK"
arm = "cold, protection off"
value = 1494.5
tol = 0.25
tol_from = "grid"
states = "nothing"
read_at_s = 1494.5
note = """
THE OTHER HALF OF AN EQUALITY, and the reason this claim is worth its own arm. The sentence
says the plating flag arrives "at the same instant" as the inhibit on the protected run,
and no variant of `states` and no field of an arm can say "the same as that other arm".
What can be said is that both instants are 1494.5 s, twice, in two claims, each measured on
its own trajectory. Move either one and exactly one claim reddens — which is what an
equality asserted by two independent pins buys.

It is not a coincidence of the tolerance either: both flags are decided by the same
threshold crossing. `PLATING_RISK` is raised when a cold cell is charged above a C-rate
threshold and `UT` inhibits charging below `t_charge_min_k`, and this chemistry sets
`t_plating_min_k` and `t_charge_min_k` to the same 273.15 K — so the inhibit exists exactly
where the damage begins, which is the sentence's point and the last line of the step.

`nothing` again: the literal carries no digit. The step this arm is on runs 2600 s further
and everything past the flag is the sentence's "carrying on regardless", which no number in
the prose states.
"""

# --- step 16: the same discharge, one block different, dead in half the time -------
#
# THE FIRST CLAIMS IN THIS FILE ON A DOYLE-FULLER-NEWMAN RUN, and now the densest LEDGERED
# step in the path: every one of the 33 numerals its prose prints is tied to something. The
# engine has carried the model since its porous-electrode phase and a client has been able
# to select it since `dfn-scenario`; what it had never had is a standing check that the
# sentences a reader is shown about it are the ones it produces.
#
# COST, MEASURED RATHER THAN ASSUMED, because this file's own rule is that a check needing
# too much is a check that does not run. One trajectory is built per (step, arm) and every
# claim on it reads the same rows, so eleven claims cost one run — 250 steps at dt = 2 to the
# 500 s mark. That run takes the default `cargo test` gate from 4.0 s to 6.4 s: the single
# most expensive thing in this file by a wide margin, and still 0.57 s in release.
# The 18 steps after the cut-off are a third of it on their own, because a Newton solve
# that has stopped converging burns its whole iteration cap every step. A claim on the 1 C
# rerun the last paragraph instructs would be 1742 steps on each of TWO models — roughly
# fifty times this — which is why that paragraph now states its boundary without numbers:
# see `docs/plans/path-ledger-dfn-step.md`.
#
# EVERY CLAIM HERE IS MEASURED ON THIS STEP'S OWN PACK, and that has not changed — `run`
# builds one pack per (step, arm), so nothing here can read the twin. What changed is that
# the twin's numbers no longer have to be claimable to be checked: the step is written as
# one half of a pair and quotes its twin constantly — `3.918`, `3.471`, `3.437`, `6.33 W` —
# and the LEDGER quotes those off step 15's own claims (`Tie::Quoted`), which check 7 checks
# where they live. The literals below still stop short of the fragments naming the twin, and
# that is now a division of labour rather than a dodge: this file's claims are about this
# pack, and the sentence's other half is tied to the pack that produced it.
#
# WHAT IS NOT CLAIMED HERE AND IS TIED BY THE LEDGER INSTEAD, because the distinction is
# where this step's numbers actually live:
#   * "it drops **535 mV**" — a difference of this step's own claimed 2.957 and 2.422, taken
#     by `Tie::Difference` over the two claims. The sentence prints neither operand, so the
#     `Derived` accounting arm, which reads a sentence's own tokens, cannot reach it.
#   * "15.459594 A for 464 s is 1.99 A·h" — the sentence does that arithmetic itself and is
#     right on its own terms (15.459594 x 464 / 3600 = 1.9927), which is what the ledger
#     checks: the demand box times this step's own crossing claim, read in hours.
#     `delivered_ah` would answer 1.984 at 464 s, because it EXCLUDES the row at `at_s` on
#     purpose — the cutoff step is the one that went too far, and the lead-acid claims take
#     the same conservative end of the same bracket. Two defensible conventions one step
#     apart; CLAIMING this number would need the sentence and the quantity to agree about
#     which, and they do not. Tying it to the arithmetic the sentence itself states is the
#     reading that does not have to choose.
#   * "2.50 V cut-off" and "this cell's 5.153198" — `v_min` and `capacity_ah` in
#     `nmc_21700_lgm50.toml`, the `Chemistry` arm. The second of those used to read `5.15`,
#     and the prose now prints the constant whole: a constant is compared EXACTLY, so a
#     rounded restatement of one could not be tied at all.
#
# ONE FLAG THE PROSE DOES NOT NAME. `OPERATING_POINT_OUT_OF_WINDOW` arrives at 464 s, the
# same step the cut-off is crossed on. The step says nothing about it, which is not a
# defect — the flag means the demand landed outside the window the pack can serve, and
# "it is finished" is that in words. It matters here for a mechanical reason: the `ReadAt`
# accounting is refused at an instant a flag arrives, so `464` has to be SPELLED by a claim
# rather than accounted as the moment two other claims are read at. `t_at_v_below:` is what
# spells it, and it spells it off the crossing the sentence actually names.

[[claim]]
step = "the-electrolyte-starves"
literal = "the panel reads **2.808 V**"
quantity = "v_at:0"
value = 2.808337
tol = 5e-4
tol_from = "spelled"
spells = "2.808"
states = "same"
read_at_s = 0.0
probe = true
display = "terminal"
shows = "2.808 V"
quoted = true
note = """
The zero-length probe, and this step's whole opening move: the page disagrees with its twin
before the reader presses anything. The step reloads, so the pack is the fresh one.

Read under THIS step's demand, 15.459594 A, so it is not an open-circuit voltage — the same
caveat step 15's probe claim carries. What makes the pair worth having is that the twin's
probe is 3.927 V on the identical cell at the identical current: 1.1 V of disagreement with
no time for anything to move at all, which is the electrolyte's ohmic and concentration
overpotential appearing in the very first solve. The twin's 3.927 is not claimed here — it
is that step's pack, and this step's prose quotes it through `Tie::Quoted` instead. The
circuit's probe used to be printed beside it and is not any more: it is a THIRD pack, on a
third scenario file, and no lesson in the path reads one at this current, so nothing in the
tree could ever have settled it. See `docs/plans/path-ledger-dfn-step.md`.
"""

[[claim]]
step = "the-electrolyte-starves"
literal = "2.808 here"
quantity = "v_at:0"
value = 2.808337
tol = 5e-4
tol_from = "spelled"
spells = "2.808"
states = "same"
read_at_s = 0.0
probe = true
display = "terminal"
shows = "2.808 V"
note = """
NOT `quoted`, AND THE REASON IS A NEAR MISS WORTH RECORDING. It was written `quoted = true`
and the suite stayed green, because that check looks for `shows` in the step's PROSE and the
row string `2.808 V` does appear there — in the sentence above, which a different claim owns.
This sentence writes "2.808 here", with no unit, so it does not quote the row at all: the
same distinction step 15's `3.439 at 460` claim documents. Left `quoted`, it would have been
this file's only claim whose `shows` is not inside its own literal, which is exactly the
independent bite the header paragraph on `quoted` says the flag is kept for — earned by
