spells_pow10 = 2
states = "same"
read_at_s = 3986.0
display = "soc (true)"
shows = "94.9 %"
note = """
ONE HALF OF THE SUBTRACTION THIS STEP IS ABOUT. Read at the trip and not at the mark, and
the tag says so: the charge stops here, but the pack goes on cooling and self-discharging
for another 114 s of simulation and reads 94.8 % at 4100 s. A claim at the mark would be
green on a different number and the sentence would be wrong.

Tagged because this step reads `soc_at` on two trajectories at two instants — this one and
99.5 % on the unprotected arm — and `Tie::Quoted` needs an address, which is what the
