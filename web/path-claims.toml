The literal stops at "2.808 here" and does not take the parenthetical whole, deliberately:
`3.927 for the particle` sits two words earlier and is the twin's pack, which a vocabulary
rule quotes. A literal reaching across it would cover a token a rule also covers, which is
the double-accounting panic in `every_numeral_in_a_ledgered_step_is_accounted_for`.
"""

[[claim]]
