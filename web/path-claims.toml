connected to. This is the number that makes the step's title literal rather than figurative.
"""

# =====================================================================================
# CHARGE LEGS
# =====================================================================================
#
# A step may declare one `[[leg]]`: a second demand the *reader* is instructed to type
# into the demand box at the mark, which the harness then runs on the same pack. Claims
# read on it carry `after_mark = true`.
#
# This is safe to model as "the same pack continues" because that is what the page does:
# `pathArrived` sets `path.until = null` and pauses, the demand input has no change
# handler at all — `advance` reads its value fresh on the next frame — so pressing Run
# after typing a new current resumes the trajectory with nothing rebuilt and `dt`
# unchanged.
#
# WHAT A LEG DOES NOT BUY. `run_for_s` is this file's own choice. Before the mark the page
# stops at `until_s` whatever the reader does, so the reachability check is a fact about
# the page; after the mark the page stops for nothing, so a leg long enough to reach a
# claim makes that claim reachable by construction. The non-circular half is
# `instruction`: the sentence that tells the reader to make this exact change must appear
# verbatim in the step's own prose, and the current must be spelled inside that sentence.
# Read a green leg claim as "true of the trajectory a reader following this sentence
# produces" — not as "a reader will get this far".

[[leg]]
step = "past-empty"
instruction = "Now put the demand box to **−2**, which charges at the same rate, and press Run"
demand_a = -2.0
run_for_s = 280.0
note = """
254 s of that is the debt being repaid, which is the last thing the step's prose points
at ("2.0655 V on the step where the deficit reaches zero"). The extra 26 s is so the
furthest claim is not sitting on the final row of the run.
"""

[[leg]]
step = "what-it-cost"
instruction = "Now put the demand box to **−2** and press Run"
demand_a = -2.0
run_for_s = 400.0
note = """
The furthest thing this step's prose asks a reader to look at on the charge leg is
`soh cap` reading 95.14 % "from 390 s in", so the leg runs 400 s past the 600 s mark.
"""

# =====================================================================================
# THE LEDGER
# =====================================================================================
#
# Checks 1-6 are all about a sentence some claim already quotes. A step with no claim has
# no literal to scan, so nothing in this file touches it — and fourteen of the
# twenty-four steps were in exactly that position. `docs/plans/path-prose-ledger.md`
# measured all fourteen by hand and found two defects in about 145 measurement-shaped
# numbers: six figures in step 19 that went stale when aging began growing the RC
# resistances, and a 600-second contrast in step 14 between two models that has never
# existed. Both were introduced by slices that ran a fully green suite. Nothing could
# have reddened, because there was no claim to redden.
#
# The ledger is the other axis: a step named in `steps` below has its prose scanned end
# to end, and EVERY NUMERAL in it must be tied to something. Not the sentences that are
# claimed — all of them.
#
# WHAT IS LEDGERED TODAY, and it is a beginning rather than a coverage claim: three
# steps, fourteen numerals, all of them scenario constants. Those three were picked
# because the same measuring pass found they carry no measurement-shaped figure at all,
# so they can be closed before a single number is measured. The remaining eleven
# unclaimed steps need arms this file has not got — see the plan.
#
# NUMERAL, NOT NUMBER, and the difference is load-bearing. The scan finds digits, so a
# quantity spelled in English goes straight past it — and two of these three steps state
# four that way: "about half a point across the whole grid" and "a quarter of a point"
# between the two cells of a group (step 3), "a gap of about three points" and "a fraction
# of a point" of sensor drift (step 4). All four are engine measurements. Three of them
# are still checked by nothing; the estimator gap now has two claims, at the mark and at
# its narrowest, and they are claims rather than ledger entries — this scan cannot see the
# sentence they are about. A ledgered step is digits-closed, which is less than closed.
#
# Teaching the scan to read those words is one slice with three parts and not one part: a
# vocabulary that sees "three points" sees "half a point" too, which is step 3's per-cell
# spread, which needs the measurement and the `claimed` arm behind it. Drawing the
# vocabulary anywhere short of that would be drawing it exactly where the claims that
# already pass happen to sit.
#
# ONE ARM, and the vocabulary that makes it honest. The arm says "this number is the
# value of a NAMED FIELD of the step's scenario file". Naming the field is the whole
# point: a generous arm — "the number appears somewhere in the scenario" — accounts for
# a third of the path's numbers and means nothing, because a scenario file has enough
# integers in it that a `2` finds `series = 2` by accident. So something has to say which
# field a sentence is talking about, and that something is the phrase around the number:
# `SCENARIO_VOCABULARY` in path_claims.rs maps "`{n}` in series" to `pack.series`.
# The vocabulary is a declaration; the NUMBER never is. It is read out of the scenario
# file and compared, so a rule pointed at the wrong field fails on sight — the same way a
# mis-pointed `spells` does. There is no waiver variant, for the reason check 6 has none.
# A `*` in a path walks an array and is read STRICTLY: every value it reaches has to be
# the number. It was existential first, and that let step 5's "in the same instant" pass
# with the two faults 100 s apart — measured, not argued.
#
# A LEDGERED STEP MAY NOW CARRY CLAIMS, and `belief-drifts` is the first that does. The
# fence used to refuse the combination outright, because a number a claim ties to the
# engine has no accounting in the scan. What went in is a pair of claims on a quantity the
# sentence spells in LETTERS — "about three points" — so the scan, which finds digits, is
# unchanged by them: this step's three digits are the scenario constants they always were.
# The arm a claimed NUMERAL would need is check 6's own accounting, which is written and
# tested, and it stays deferred until a number needs it, for the reason that has decided
# every arm here: a `CCCV_PERIOD_S` is what you get from wiring one in with nothing to
# account. The ledger's failure message already routes an author to it.
#
# BOTH LISTS ARE REQUIRED. An opt-in list on its own would let a twenty-fifth lesson join
# the unchecked majority in silence, which is how the fourteen came to exist. Every
# lesson must appear in exactly one list, so adding a step is a decision someone writes
# down. That is the contract `every_covered_step_exists` keeps for claims, kept in both
# directions.

[ledger]
steps = [
  "pack-disagrees",  # 4 numbers: the topology and the scatter
  "belief-drifts",   # 3: what the BMS's own current sensor is wrong by. Also claimed —
                     # two claims on its estimator gap, which the prose spells in words
  "lying-sensor",    # 7: the two scheduled faults, read straight off the file
]
# Not scanned, and why. Ten of these carry claims, so their claimed sentences are checked
# and the rest of their prose is not; the other eleven are unchecked entirely.
unledgered = [
  "bare-curve",                     # claims: 3
  "same-discharge-other-chemistry", # claims: 5
  "protection-on",                  # claims: 2
  "protection-off",                 # measured 2026-08-13, no claim yet
  "wearing-out-while-idle",         # claims: 3
  "two-legs",                       # measured, no claim yet
  "leg-that-is-not-there",          # claims: 6
  "what-protection-costs",          # two perf ratios no trajectory can settle
  "circuit-repeats-itself",         # needs the zero-length probe row
  "particle-remembers",             # needs the zero-length probe row
  "three-times-the-current",        # measured, no claim yet
  "looks-fine-from-outside",        # needs an instructed continuation
  "the-electrolyte-starves",        # three perf ratios; needs a 1 C rerun
  "the-gradient-itself",            # needs the zero-length probe row
  "one-step-that-got-through",      # needs two step lengths and both buttons
  "nothing-to-clamp",               # needs a BMS toggle and an ambient change
  "past-empty",                     # claims: 14
  "what-it-cost",                   # claims: 20
  "slow-and-patient",               # claims: 4
  "sixty-times-the-current",        # claims: 4
  "and-it-is-still-in-there",       # claims: 8
]
