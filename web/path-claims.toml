# --- step 9: putting it back, and the two legs of a charge -------------------------
#
# THE FIRST CLAIMS THAT READ PAST A CC-CV TAPER. Step 10 is a CC-CV step and has been
# claimed since the charge-legs slice, but its cell fills up before it ever reaches its
# voltage limit — that is the whole lesson of step 10 — so it is on constant current for
# its entire run and no claim on it has ever seen the second leg. This step is the one
# where the leg actually changes, and the one whose sentence says when the charge STOPS.
#
# WHAT MADE THAT SENTENCE CLAIMABLE, because it was not before. `ccCvDone` is evaluated at
# the end of each chopped chunk, and a chunk ends at a decision-window boundary OR wherever
# the frame's step budget ran out — so in general the instant the page stops is somewhere
# between the crossing and the next window boundary, and which is a fact about the browser.
# `drive` says so and no claim was allowed to read past a taper.
#
# It is claimable here for a reason particular to this trajectory: the crossing lands ON a
# window boundary. 6210 s is step 12420 at dt = 0.5, and 20 steps is the window, so 12420 is
# a multiple of it. A chunk never crosses a boundary, so every boundary is a chunk end and
# the test is certainly evaluated there — and the step before is still over the taper. The
# page stops at 6210 whatever the frame rate. `cccv_taper_s` asserts that boundary property
# rather than assuming it, and refuses to answer at all if the crossing ever moves off the
# grid. See the note on the claim itself.
#
# THIS STEP IS LEDGERED, so everything below is the whole of its prose and not a selection.
# What used to stand here was a list of what it left unchecked, and every item on it has
# been closed — worth reading in the order it happened, because two of the three were
# closed by slices that never looked at this step:
#
#   * "**The last leg is 13 % of the time for 5 % of the charge**" — the headline, and
#     both figures are ratios of other numbers in the prose. The note said this needed the
#     `Derived` accounting arm and that no such arm existed; it was the third slice running
#     to say so. `Accounted::Derived` was built two slices later, and the note was never
#     updated — a false statement about the code, sitting in this file for five days,
#     invisible to every check because no check reads a sentence ABOUT the tree.
#     (In the end the headline needed neither: `Derived` reads a sentence's own printed
#     siblings, and this sentence prints its answer two paragraphs away from its operands.
#     It is `Tie::Ratio` over `Tie::Difference` over `Tie::Quoted` — the family that reads
#     files and claims.)
#   * The `0.15 A` cutoff, the `20 %` starting charge and the `10 s` decision window. All
#     three now have arms: `Control::Taper`, `pack.initial_soc`, and `Tie::Page`, which
#     parses `CCCV_PERIOD_S` out of `web/app.js` — the constant this test has pinned in
#     `MIRRORED` since the day it was written and never once read.
#
# ONE NUMBER LEFT THE PAGE, on the terms step 16 set: the sentence about the speed
# multiplier said the experiment "would take a different path at 1× and at 800×", and the
# `1` is not a control, a file's number or a measurement — it is the identity, the way a
# reader says "real time". Nothing in the tree decides it. The sentence now reads "in real
# time than at 800×", which says the same thing and prints one number instead of two.
#
# WHAT THE LEDGER STILL DOES NOT REACH HERE, and it found a defect on the way in. The step
# opened "Eight steps of taking charge out; this one puts it back" — a self-count spelled in
# letters, which the digit scan goes straight past. Hand-checked when this step was
# ledgered: `two-legs` is the ninth lesson, so eight steps do precede it, but the eighth is
# `wearing-out-while-idle`, whose demand is `Rest` and whose own prose says "no current
# flows anywhere". Seven take charge out. The sentence now says so.
#
# That is the second defect a hand-check of a word numeral has found here (see
# docs/plans/path-self-description-sweep.md for the first four), and neither scan in this
# file can see either. A ledgered step is digits-closed, which is less than closed.

