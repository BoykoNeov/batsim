Read at the same tagged instant as the two above, because all three are the same sentence
describing one frame. Cells rather than groups is the prose's word and the same number
either way — a parallel group has one node voltage, so `v_cell_min` and `v_cell_max` are
per-GROUP readings and every cell in a group sits at its group's voltage.

No `display`: `cell v` prints the two ends and not their distance.

THE THINNEST MARGIN IN THIS STEP, and worth knowing rather than discovering. The spread is
11.023 mV here and 10.388 mV one step later, so the two readings are 0.635 mV apart against
