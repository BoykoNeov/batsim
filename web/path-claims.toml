#
# THE FIVE `pulse_*` QUANTITIES, and the measurement that decided them. Both steps break a
# single tooth into three parts — what comes back the instant the current stops, what climbs
# back over the ten-minute rest, and what never comes back — and the boundary between the
# first two is the terminal voltage at the moment the current goes away. No stepped row
# holds it: the first rest sample is already one `dt` into the relaxation.
#
# Read off the rows, the circuit's rebound is 71.8 mV where the prose says 74.8, and every
# other figure in both decompositions comes out low in the same way. That is not drift and
# it is not a wrong sentence; it is the harness reading half a second late, and it looks
# exactly like drift, which is why `docs/plans/path-prose-ledger.md` flagged these two steps
# as blocked rather than as wrong. Taken as a ZERO-LENGTH `Rest` READ at the stop instant,
# all ten figures reproduce to the digit. `Row::rest_v` is that read; it is taken only on
# leg boundaries, because on a porous model a `dt = 0` step is a whole solve.
#
