# to `written_numbers` — `11` and `880` — so no claim could spell it and no arm could
# account for it, and any literal containing it was unclaimable. That was silent, and it
# had shaped the file: of the four space-separated numbers in the whole of the lesson prose
# (`10 000`, `11 280`, `11 880`, `200 000`), not one appeared in a claimed literal before
# this section. `join_thousands` fixes it, narrowly, and
# `the_scanner_joins_thousands_groups_and_nothing_else` pins the near misses — because
# joining two numbers a sentence wrote separately would demand an accounting for a figure
# nobody printed, which no author could ever satisfy.
#
# WHAT WAS NOT CLAIMED WHEN THIS SECTION WAS WRITTEN, and all of it is now. The list is
# kept because each line names a thing this file could not do, and what closed it:
#   * `×1.87`, `×6.01`, `×2.48` and the `113.9 →` / `17.3 →` figures they divide — step
#     13's 1 C run, which is a different trajectory on the same file. "Nothing lets a claim
#     on one step read a run built for another" is still true; what reads it is a LEDGER
#     RULE, through `Tie::Quoted`, which names another step's claim rather than re-running
#     its trajectory. And the `×6.01` turned out to be `×6.02` — 103.9 over 17.3, two
#     already-rounded figures, where the measurements divide to 6.0171.
#   * `132.8 → 397.3`, `74.8 → 224.3`, `×2.99`, `×3.00`, the circuit's `1.84 V` at the same
#     instant, and the `−0.45` / `−0.66 V` teeth below empty — `pulse_train_ecm`, a second
#     scenario file. `pack_from` was that override and existed already; what was missing was
#     a THIRD current box on `[[arm]]`, because the page hides the simple demand field on a
