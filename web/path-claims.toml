# --- step 11: the cold charge the protection stops, and what stops nothing ----------
#
# The first arms in this file that drag the ambient slider, and they exist because of what
# the sentence they follow asserts: two flags "at the same instant". No mechanism here
# compares one arm against another — `identical_to` compares end states, not arrivals — so
# the equality is asserted the only way this file can assert it, by two claims on two arms
# pinning the SAME number. Move either arrival and one of them reddens.

[[arm]]
step = "what-protection-costs"
name = "cold"
instruction = "drag the ambient to −5 °C and watch the pack cool until `UT` inhibits the charge at 60.8 %, then switch the BMS off and see `PLATING_RISK` at the same instant"
start = "restart"
ambient_c = -5.0
actions = [{ do = "run", to_s = 4100.0 }]
note = """
`restart` rather than `mark`, and the label is slightly wider than the button: what a
reader does here is drag the slider and then press **Run**, on the pack the step just
built. That is the same trajectory the Restart button gives — a fresh pack at t = 0 with
the controls left as the reader set them — because `applyStep` has already reloaded this
scenario and `$("ambient").oninput` rebuilds nothing. The mark-side reading is not
available: at 4100 s the protected charge has already stopped at 94.9 %, so a slider
dragged there could never show a pack inhibited at 60.8 %.

Runs to 4100 s, which is the step's own mark rather than a length invented here. The arm is
this step's run under a different slider, and it carries on for 2600 s past its furthest
claim — long enough that "reachable" is not a statement about how far the harness chose to
go. Nothing else arrives in that stretch: the current is zero from the inhibit onwards and
the pack simply keeps cooling, 273.145 K at the flag to 268.297 K at the mark.
"""

