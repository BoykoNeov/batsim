value = 3.0651004
tol = 0.05
tol_from = "tighter"
spells = "three"
states = "same"
read_at_s = 600.0
note = """
The first claim in this file whose sentence spells its number in letters, and the reason
`spells` may now hold a word: "about three points" is the whole of what step 4 gives a
reader about the gap between what the BMS believes and what is true, and the choice until
now was between a claim that lies about its own wording and no claim at all. It went four
slices unchecked as the cheapest measurement left in the path — one run to the mark, no
reading taken with the clock stopped, no continuation.

Read at the mark, where the gap is at its widest: 3.0651 points, of which 3.0 is the boot
error the scenario file hands the BMS (`initial_soc_error = 0.03`) and the rest is the
sensor offset integrating. Its sibling below reads the other end.

Tolerance, and it is not the sentence's. Half a unit in "three" is half a point, which is
what the phrase licenses and far more than this claim needs. The panel has no gap row —
the reader subtracts `soc (bms)` from `soc (true)`, and each prints a tenth of a point —
so 0.05 is half a unit in the last place a reader can compute this quantity to at all: at
the mark the two rows read 66.2 % and 63.2 %, so the gap a reader gets is 3.0. That is
also why no `display` is named: there is no row to render, and the two rows behind it
belong to two other quantities.
"""

[[claim]]
step = "belief-drifts"
literal = "A gap of about three points that simply never closes — the estimate sits above the truth from the first step to the last."
quantity = "soc_gap_pts_min"
value = 3.0181816
tol = 0.05
tol_from = "tighter"
spells = "three"
states = "same"
read_at_s = 0.5
note = """
"Simply never closes", made checkable: the smallest the gap ever gets over the whole run,
which is 3.0182 points on the first sampled step. The claim above cannot say this — an
estimator that closed the gap at 300 s and re-opened it by the mark would pass a reading
taken at 600 s and fail this one. It is also the half that checks the rest of the
sentence, "the estimate sits above the truth from the first step to the last": a minimum
of three points is a statement about every step, not about one.

**The minimum being the first row is measured, not arithmetic.** The gap is not monotone
— the BMS's current sensor carries 10 mA of noise, so it wobbles from step to step — and
what the run shows is that the wobble never takes it below where it started. The estimate
lags the truth by a step, which is why the first row reads 3.0182 rather than the exact
3.0 of the boot error.

`read_at_s` is the instant the minimum happens at, and `measure()` asserts that rather
than ignoring it: a reduction over every row has no natural instant, and a decorative one
would let the shape of the run change under a green claim.

Tolerance and the missing `display` are the sibling's, for the sibling's reasons.
"""

