# =====================================================================================
# ARMS — WHAT THE READER DOES NEXT
# =====================================================================================
#
# An `[[arm]]` is an instructed control change: a sentence in a step's prose telling the
# reader to type a current, put `dt` up, uncheck the BMS, clear a fault, press Step 1, or
# simply press Run again — plus the trajectory that follows from doing it. A claim names
# the arm it is read on; a claim with no `arm` reads the step as configured, to its mark.
#
# `start` says which pack the arm begins from, and the two are not interchangeable:
#
#   mark      the step's own pack, run to its mark and then continued. That is what the
#             page leaves in front of a reader: `pathArrived` sets `path.until = null` and
#             pauses, the demand input has no change handler at all — `advance` reads its
#             value fresh on the next frame — so pressing Run after typing a new current
#             resumes the trajectory with nothing rebuilt and `dt` unchanged.
#   restart   a fresh pack at t = 0 under this arm's controls. The page's **Restart**
#             button rebuilds from the same scenario file, fault queue and all, WITHOUT
#             re-applying the step's own controls — which is exactly why step 18 tells the
#             reader to press it rather than Back-then-Next, and why `dt` and `bms`
#             overrides live here. The BMS checkbox is a restart too: `$("bms").onchange`
#             clicks Reset, so unchecking it puts the run back to t = 0.
#
# `actions` are the buttons, in the order they are pressed. What separates them is the one
# thing step 18 is about: whether the pack advances. `clear_queued` and `clear_latched`
# change the pack without stepping it; `step_1` and `run` step it.
#
# WHAT AN ARM DOES NOT BUY. How far a `run` action goes is this file's own choice. Before
# the mark the page stops at `until_s` whatever the reader does, so the reachability check
# is a fact about the page; after it the page stops for nothing, so an arm long enough to
# reach a claim makes that claim reachable by construction. The non-circular half is
# `instruction`, and it is stricter than a leg's was: the sentence must appear verbatim in
# the step's own prose AND every control the arm overrides must be anchored in it — the
# current spelled, the timestep spelled, the BMS named — and every override must be a real
# change from what the step configures. Read a green arm claim as "true of the trajectory
# a reader following this sentence produces", not as "a reader will get this far".

[[arm]]
step = "one-step-that-got-through"
name = "dt 5"
instruction = "Put `dt` up to 5 s and press **Restart**, which rebuilds this pack from the start, from the same file — fault and all — without touching the controls you just set, and then Run."
start = "restart"
dt = 5.0
actions = [{ do = "run", to_s = 90.0 }]
note = """
The arm `start = "restart"` exists for. The reader types 5 into the `dt` box and presses
**Restart**, which rebuilds the pack from the scenario — fault queue and all — and leaves
the controls alone. Back-then-Next would re-apply the step and put `dt` back to 0.5, which
the prose says in so many words, so the two are not interchangeable and this is the one
the sentence names.

Runs to the step's own 90 s mark, because that is where the page stops: `until_s` is a
property of the step, not of the trajectory, so a restarted run stops there too.
"""

[[arm]]
step = "one-step-that-got-through"
name = "unlatched"
instruction = "**Clear latched BMS fault** on its own only unlatches: Run, and the short, still connected, delivers a *second* tooth and it latches straight back one step later. At this step's 10× that tooth is one spike on the current plot and the readouts have moved past it before you can read it — press **Step 1** twice instead and it holds still"
start = "mark"
actions = [{ do = "clear_latched" }, { do = "step_1" }, { do = "step_1" }]
note = """
One button and two steps. The instruction spans two sentences because the arm does what
both of them say: the first tells the reader to clear the latch and warns that Run makes
the tooth unreadable, the second tells them to press Step 1 twice instead.

Neither button advances the clock, which is why this arm's first row is at 90.5 s and not
at 90.0: the clear happens at the mark and the pack has not moved when it does.
"""

[[arm]]
step = "one-step-that-got-through"
name = "cleared, then run"
instruction = "this time press **Clear queued** first — despite its name it is a repair, and its note counts the short it removed as *1 fault* — before clearing the latch. One **Step 1** now reads"
start = "mark"
actions = [
  { do = "clear_queued" },
  { do = "clear_latched" },
  { do = "step_1" },
  { do = "run", to_s = 160.0 },
]
note = """
The repaired pack. Same mark, same two buttons, one extra: **Clear queued** removes the
short itself, so the Step 1 that follows draws nothing and the contactor stays closed.

The claim on this arm reads 150.5 s, which is the sentence's own "over the following
minute" counted from the Step 1 at 90.5. The arm runs ten seconds further, for the reason
step 20's charge leg runs 26 s past its own furthest claim: an arm that stops exactly
where its last claim reads makes "reachable" mean only "I ran long enough to reach it",
which is the tautology the ARMS section warns about. Ten seconds of a pack doing nothing
is not a length picked to reach anything.
"""

[[arm]]
step = "one-step-that-got-through"
name = "buttons"
instruction = "this time press **Clear queued** first — despite its name it is a repair, and its note counts the short it removed as *1 fault* — before clearing the latch."
start = "mark"
actions = [{ do = "clear_queued" }, { do = "clear_latched" }]
note = """
The two buttons and nothing else — no Step 1, no Run. It carries no claim and is not
meant to: it exists to be the thing `buttons reversed` is compared against, which is the
only way to state the sentence below.
"""

[[arm]]
step = "one-step-that-got-through"
name = "buttons reversed"
instruction = "Press those same two buttons in the other order, still without running, and you get an identical pack"
start = "mark"
actions = [{ do = "clear_latched" }, { do = "clear_queued" }]
identical_to = "buttons"
note = """
THE ONE SENTENCE IN THIS STEP THAT IS NOT ABOUT A NUMBER. No `quantity` says "you get an
identical pack", and picking one that happens to match — the terminal voltage, say — would
be asserting a weaker thing than the reader is told. So the assertion is the pair: both
arms stop at the buttons, "still without running", and their serialised snapshots must be
equal.

Stopping at the buttons is load-bearing. Comparing after an identical Step 1 and a minute
of running would be green if the two orders left different packs and the run washed the
difference out, which is exactly the failure the sentence is warning about — "the move you
cannot take back is the Run".
"""

[[arm]]
step = "nothing-to-clamp"
name = "bms off"
instruction = "Now uncheck the BMS and run it again — and then keep running, because this step's mark is 200 s and everything worth seeing on the unprotected arm happens after it. Press Run at the mark and let it run on until the current is down to hundredths of an amp."
start = "restart"
bms = false
actions = [{ do = "run", to_s = 420.0 }]
note = """
`start = "restart"` because the page has no other way to do this: `$("bms").onchange`
clicks Reset, so unchecking the box rebuilds the pack from the scenario and the run goes
back to t = 0. The fault queue comes back with it, which is what makes this the same
experiment as the protected arm rather than a different one.

The furthest numbers on this arm — 0.103 A and 362 K — are read at 400 s, and the prose
sends the reader there by describing the current rather than by naming an instant: "let it
run on until the current is down to hundredths of an amp". It used to say "about 400 s",
and that digit came out when this step was ledgered — nothing in the tree decides it. A tie
reading this claim's own `read_at_s` would have been the author supplying both sides, and
retargeting the arm to stop at 400 would have broken the rule below. The arm runs twenty
seconds further, so that the last claim is not sitting on the last row.

One thing this arm does NOT reproduce: the step declares `transport: "wasm"`, because the
BMS toggle needs an in-page rebuild that a socket session cannot do. Nothing here reads
`transport` — this harness drives `sim_core::Pack` directly — so the arm is the same
trajectory either way. The field is about which backend the reader must be on, not about
what the engine computes.
"""

[[arm]]
step = "past-empty"
name = "charge leg"
instruction = "Now put the demand box to **−2**, which charges at the same rate, and press Run"
start = "mark"
demand_a = -2.0
actions = [{ do = "run", to_s = 4680.0 }]
note = """
280 s past the 4400 s mark. 254 s of that is the debt being repaid, which is the last
thing the step's prose points at ("2.0655 V on the step where the deficit reaches zero").
The extra 26 s is so the furthest claim is not sitting on the final row of the run.
"""

[[arm]]
step = "what-it-cost"
name = "no reversal damage"
instruction = "the identical run with the over-discharge coefficient set to zero and nothing else touched"
start = "restart"
fade_per_ah = 0.0
actions = [{ do = "run", to_s = 600.0 }]
note = """
The file's one counterfactual arm, and the only one whose instruction is a REPORT rather
than an instruction: nothing on the page can zero a chemistry coefficient, so a reader is
being told what was measured rather than told to measure it. `Arm::fade_per_ah` argues at
length for allowing that, and the four fences it carries are what keep it from becoming a
way to run any trajectory at all under a sentence that mentions it.

**It stops exactly at the step's own mark, and that is the one place this file's usual
"run past the furthest claim" habit would be wrong.** Step 18's repaired arm runs ten
seconds long so that "reachable" means more than "I ran long enough"; here the sentence is
*"ends the same ten minutes at 99.96 %"*, and the comparison it makes is only a comparison
if both arms stop at the same instant. The length is the sentence's, not a length chosen
to reach a number.

Its claim is the mark reading. What the arm asserts beyond that claim is in the claim's
own note: the two trajectories agree to the last decimal up to the knee, because
`[reversal]` is the only thing between them and nothing has gone past empty yet.
"""

[[arm]]
step = "what-it-cost"
name = "charge leg"
instruction = "Now put the demand box to **−2** and press Run"
start = "mark"
demand_a = -2.0
actions = [{ do = "run", to_s = 1000.0 }]
note = """
The furthest thing this step's prose asks a reader to look at on the charge leg is
`soh cap` reading 95.14 % "from 390 s in", so the arm runs 400 s past the 600 s mark.
"""

# =====================================================================================
# THE LEDGER
# =====================================================================================
#
# Checks 1-6 are all about a sentence some claim already quotes. A step with no claim has
# no literal to scan, so nothing in this file touches it — and fourteen of the
# twenty-four steps were in exactly that position. `docs/plans/path-prose-ledger.md`
# measured all fourteen by hand and found two defects in about 145 measurement-shaped
# numbers: six figures in step 19 that went stale when aging began growing the RC
# resistances, and a 600-second contrast in step 14 between two models that has never
# existed. Both were introduced by slices that ran a fully green suite. Nothing could
# have reddened, because there was no claim to redden.
#
# The ledger is the other axis: a step named in `steps` below has its prose scanned end
# to end, and EVERY NUMERAL in it must be tied to something. Not the sentences that are
# claimed — all of them.
#
# WHAT IS LEDGERED TODAY, and it is a beginning rather than a coverage claim: twenty-four
# steps, 626 numerals, and no longer all of them scenario constants. This count is NOT
# the fourteen a few lines above: that one is frozen, and counts the steps that had no
# claim when the ledger was written. They were equal for one slice and have now parted,
# which is what the last slice said would happen — a live count moves and a frozen one
# does not. The first
# three were picked because the same measuring pass found they carry no
# measurement-shaped figure at all, so they could be closed before a single number was
# measured. The fourth could not be: step 6's opening sentence prints the pack, the pack's
# capacity, the cell's rating and the demand in one breath, and its expect prints the
# clamped current and the demand box again — four different kinds of number in eight
# numerals, which is why it cost three arms and one claim. The sixth, step 22, is where the
# taxonomy closed: twelve of its sixteen numerals were untied and not one was a field a rule
# could read straight off a file, which took four more arms including the derivation the
# plan had reserved from the start. The seventh and eighth are steps 23 and 24, the rest of
# the lead-acid run, and they are where the taxonomy learned to look SIDEWAYS: half of step
# 23's sentences are comparisons with the step before it, so its numbers are facts about
# step 22 — its demand box, its clock, the amp-hours and the heat it measured. Three more
# arms (`Elsewhere`, `Quoted`, and an operation on `Derived`) and a fourth control. Ledgering
# them found three defects in prose the whole suite was green on, one of which had been
# asserted three times over in two files. The twelfth is step 9, the charge, and it is the
# first whose subject is the PAGE'S OWN POLICY rather than the engine's behaviour: `CC-CV`
# is two demands with a rule between them, so its cutoff is a control, its decision window
# is a constant of the client — parsed out of `web/app.js` by the eighteenth arm rather than
# declared here — and its headline is a ratio of its own claims in a sentence that prints
# neither operand. It also cost one number its place on the page (`1×`, the identity, which
# nothing in the tree decides) and turned up a false self-count spelled in letters. Of the
# steps below, those that
# carry no claim at all and need arms this file has not got: none. Every step in this list
# now carries at least one measured number, which was not true five slices ago. (Two steps
# in the repo still carry none, and they are both LEDGERED ones — scanned end to end for
# numerals and measured nowhere, which is the opposite gap.) What the list still lacks is a
# scan over its whole prose, and that no longer waits on an arm: what each of those steps
# needs now is its own vocabulary and its own measurements. See the plan.
#
# NUMERAL, NOT NUMBER, and the difference is load-bearing. The scan finds digits, so a
# quantity spelled in English goes straight past it — and four of the ledgered steps state
# six MEASUREMENTS that way (step 9 states a count of the path itself, which is the
# paragraph below): "about half a point across the whole grid" and "a quarter of a point"
# between the two cells of a group (step 3), "a gap of about three points" and "a fraction
# of a point" of sensor drift (step 4), and "all but three points of what it holds" at the
# end of step 22. All five are engine measurements. Four of them are still checked by
# nothing; the estimator gap now has two claims, at the mark and at its narrowest, and they
# are claims rather than ledger entries — this scan cannot see the sentence they are about.
# A ledgered step is digits-closed, which is less than closed.
#
# AND THE CASE THAT PROVES IT COSTS SOMETHING. Step 9 opened "Eight steps of taking charge
# out; this one puts it back" — not a measurement but a count of the path itself, and false:
# seven of the eight take charge out and the eighth is the pack at rest. It survived this
# scan, check 6, and the whole suite, because it is spelled in letters. Hand-checked and
# fixed when the step was ledgered — and reworded twice, because the first repair said
# "and one of leaving it alone", which prints a SECOND word numeral into the paragraph
# documenting that they are invisible. A sixth word numeral in a ledgered step, and the
# first one anybody has caught being wrong.
#
# ONE WORD IS NOW READ, AND IT IS NOT A SCANNER. Step 22's "six of these in series is the
# 12 V battery" derives its `12` from a word, and `Operand::Word` translates that one word
# where the rule names it. Nothing else changed: "all but three points" in the same step's
# own expect is as invisible as it was, and so is "twenty hours" two paragraphs above it.
# A green ledger is still a statement about a step's digits.
#
# Teaching the scan to read those words is one slice with three parts and not one part: a
# vocabulary that sees "three points" sees "half a point" too, which is step 3's per-cell
# spread, which needs the measurement and the `claimed` arm behind it. Drawing the
# vocabulary anywhere short of that would be drawing it exactly where the claims that
# already pass happen to sit.
#
# THE ARMS THEMSELVES, and there are twenty-six of them. An arm says what decides a number: a
# NAMED FIELD of the step's scenario file, a named field of the CHEMISTRY that scenario
# names, a CONTROL on the lesson's own block, the sentence's own arithmetic over those as a
# PRODUCT, a RATIO, a DIFFERENCE or a SUM, a duration of theirs read IN HOURS, the SPAN of a
# chemistry table end to end, a NODE of one, digits
# inside a NAME, digits inside the NAME OF A FILE an arm picks, the LABEL of a control read
# out of `web/index.html`, HOW MANY ENTRIES an array of the scenario has, the OPEN-CIRCUIT
# VOLTAGE at a charge one of them names, the MAGNITUDE of any of them, the POSITION of
# another lesson in the path, the panel's CLOCK at the step's
# mark, a CONSTANT OF THE PAGE parsed out of `web/app.js`, a figure the sentence works out
# from its OWN SIBLINGS, the same question asked of
# ANOTHER LESSON, the same question asked of ONE OF THIS STEP'S ARMS — a control it
# overrides, or a field of the file it picks — a measurement some step's CLAIM decides, WHEN
# that claim was read rather than what it came to, a period the page holds said as the RATE
# PER SECOND a sentence writes it at, and
# a CLAIM whose literal contains the number. Naming the field is the whole point: a generous arm — "the number appears
# somewhere in the scenario" — accounts for a third of the path's numbers and means
# nothing, because a scenario file has enough integers in it that a `2` finds `series = 2`
# by accident. So something has to say which field a sentence is talking about, and that
# something is the phrase around the number: `LEDGER_VOCABULARY` in path_claims.rs maps
# "`{n}` in series" to `pack.series` and "the chemistry is rated `{n}` C continuous" to
# `cell.max_discharge_c`. The vocabulary is a declaration; the NUMBER never is. It is read
# out of the file and compared, so a rule pointed at the wrong field fails on sight — the
# same way a mis-pointed `spells` does. There is no waiver variant, for the reason check 6
# has none. A `*` in a path walks an array and is read STRICTLY: every value it reaches has
# to be the number. It was existential first, and that let step 5's "in the same instant"
# pass with the two faults 100 s apart — measured, not argued.
#
# THE ARITHMETIC ARMS ARE THE ONES THAT ROUND, and they are the only ones that do. A
# constant printed in prose either is the file's number or is wrong about it, so it is
# compared exactly. A computed number is not: step 6's "4.61 Ah at pack level" is the cell's
# 2.303451 Ah times the pack's 2 in parallel, which is 4.606902 — and no sentence would
# print that, so it is compared at the precision the sentence itself commits to, through
# the same rounding rule the page uses. The same goes for the ratio, the span and the
# derivation: 7.2 / 0.36 is 20.000000000000004 and 2.130 - 1.950 is 0.17999999999999994.
# The SUM is step 19's, and it is the one of the four whose order says nothing: reversed,
# a difference changes sign and a ratio inverts, where a sum is the same number. What it
# carries is a threshold no file holds — the chemistry's ceiling for the cell plus the
# scenario's hard margin, which is what a probe is actually compared against.
# Each factor has to resolve to exactly one number: a wildcard under a product would make
# "which of them" the author's pick.
#
# THE SPAN, THE CLOCK AND THE DERIVATION are step 22's, and each exists because no arm
# above it could carry the sentence. "Lead-acid spans only 180 mV end to end" is about the
# WHOLE OCV table rather than a node of it. "The panel reads 19.3h" is not the mark
# (69620.5 s) and is in no file at all — it is what the `sim time` row prints there, so the
# tie is to that row's own formatter, which is the same mirror the display check runs on.
# And "six of these in series is the 12 V battery" is the arithmetic the plan reserved the
# last slot for: the `12` is the `2 V` the same sentence prints, six times over. Its
# operands are declared and its value never is, and every operand must be accounted for by
# an arm that is NOT a derivation — a derivation resting on derivations has no floor.
#
# ONE ARM IS A CLAIM, and it is check 6's accounting reused whole rather than a
# second reading of the same claims. If the number sits INSIDE the literal of a sentence
# some claim quotes, that sentence's own claims account for it — spelled, read at, shown,
# or a step length — and the ledger asks `accounting_for` the same question check 6 asks.
# Positional, not step-wide, and that is the strength of it: "some claim on this step
# spells 14" would account for a `14` in a sentence no claim is about, which is exactly
# the prose the ledger exists to reach. Step 6 states its clamped current in two
# sentences, and closing the second one meant claiming it. A number accounted BOTH ways —
# by a rule and by a claim — is refused rather than resolved, on the same terms as two
# rules covering one number.
#
# A LEDGERED STEP MAY CARRY CLAIMS, and `belief-drifts` was the first that did. The fence
# used to refuse the combination outright, because a number a claim ties to the engine had
# no accounting in the scan. It came down for a pair of claims on a quantity the sentence
# spells in LETTERS — "about three points" — which the digit scan cannot see at all; the
# arm above is what closes the case those two only stepped around.
#
# BOTH LISTS ARE REQUIRED. An opt-in list on its own would let a twenty-fifth lesson join
# the unchecked majority in silence, which is how the fourteen came to exist. Every
# lesson must appear in exactly one list, so adding a step is a decision someone writes
# down. That is the contract `every_covered_step_exists` keeps for claims, kept in both
# directions.

# --- step 18's headline, now that a step length can be accounted for ---------------
#
# The sentence three slices have named and none could claim. What blocked it was never
# the trajectories — `docs/plans/path-arms.md` built the `dt 5` arm and measured both
# halves exact — it was check 6: the sentence prints `0.5`, `5` and `10` as CONTROL
# SETTINGS, and the accounting knew only `spelled`, `read at` and `shown`. A step length
# is none of the three, so claiming the sentence meant leaving three of its numbers tied
# to nothing. `Accounted::Setting` is the fourth arm and it ties each of them to the step
# length of a trajectory a claim here really reads: 0.5 to the step's own run, 5 to the
# `dt 5` arm, 10 to the `dt 10` arm below.
#
# The five measurements are a COST rather than a level — points of charge gone and kelvin
# gained since the panel the reader was looking at when they pressed Run — so they are
# read with `soc_lost_pts_at` and `t_rise_k_at`, both differences from the zero-length
# probe. Claiming the levels instead (89.44 %, 316.85 K) would be claiming numbers this
# sentence does not print.

[[arm]]
step = "one-step-that-got-through"
name = "dt 10"
instruction = "0.56 points at 0.5 s, **5.57 at 5 s**, 11.14 at 10 s, where the cell ends 19 K hotter instead of 1."
start = "restart"
dt = 10.0
actions = [{ do = "run", to_s = 90.0 }]
note = """
The third of the step's three step lengths, and the one whose instruction is WEAKER than
its sibling's — said here rather than left to be noticed. The `dt 5` arm cites a sentence
that tells the reader what to type and what to press. This one cites the headline itself,
which names 10 s and reports what happens at it without repeating the procedure. The
procedure is the one spelled out two sentences earlier and nothing else in the step
mentions 10 s at all, so a reader who wants to check this number has exactly one way to
produce it — but the sentence does not say "now do it again at 10", and a stricter fence
than `contains_number` would refuse this arm.

Runs to the step's own 90 s mark for the same reason `dt 5` does: that is where the page
