# Machine-checkable claims made by the guided path's lesson prose (`web/app.js`,
# `const LESSONS`).
#
# WHY THIS FILE EXISTS
# --------------------
# The lesson prose states hundreds of specific quantities — millivolts, seconds,
# SOC points, watts, flag arrival times. Four separate slices have found numbers in
# it that had drifted from the engine, were never true, or were true about a
# quantity no reader can look at (`docs/plans/path-numbers.md`, `path-buttons.md`,
# `reversal-ui.md`, `reversal-damage-ui.md`). Every one of those was found by a
# measuring instrument that lived outside the repo and therefore never ran again.
#
# `crates/sim-data/tests/path_claims.rs` reads this file and checks each entry up to
# SIX independent ways. Each catches a failure the others cannot:
#
#   1. LITERAL  — `literal` must appear verbatim in that step's own prose/expect
#                 text. Catches: the prose was edited and the claim was not.
#   2. VALUE    — the engine, driven exactly as the page drives it, must produce
#                 `value` within `tol`. Catches: the engine moved under the prose.
#   3. REACHABLE— `read_at_s` must not be past the step's own `until_s`. Catches:
#                 "right but unreachable" — a number that is true of a trajectory
#                 the reader is never shown. WEAKER on a charge leg: see
#                 `after_mark` below and the CHARGE LEGS section at the foot.
#   4. DISPLAYED— optional. If the claim names a readout row, that row's own
#                 formatter must print exactly `shows` at `read_at_s`. Catches:
#                 true of the engine, and not what the panel says. A row is a step
#                 function of the number behind it, so a drift well inside `tol`
#                 can still turn `0.0 %` into `0.1 %` or `99.45` into `99.44`.
#   5. STATED   — the number the SENTENCE prints must be the number the engine
#                 produced, read through the frame the sentence uses it in
#                 (`states`). Catches: checks 1 and 2 passing with nothing between
#                 them. The literal check is a substring test against the page and
#                 the value check a comparison against the engine, so re-measuring a
#                 drifted `value` and leaving the wording alone left both green with
#                 the prose wrong — and a drift small enough to hide inside a row's
#                 rounding (0.6387 V becoming 0.6392) got past check 4 as well. See
#                 "Stating the value" below.
#   6. ACCOUNTED— every number a claimed sentence PRINTS must be tied to something, not
#                 just the one number the claim is about. Catches: the other figures in
#                 a claimed sentence, which checks 1-5 leave free to drift as long as
#                 the prose and the literal drift together — the original hole, and it
#                 survived every slice above on the numbers nobody claimed. Nothing to
#                 author: the accounting is DERIVED from the claims already on the
#                 sentence. See "Accounting for the rest of the sentence" below.
#
# A seventh check stands behind the second rather than beside it: `tol` decides how much
# of a claim is actually claimed, so it is derived by a declared rule (`tol_from`) and
# the derivation itself is checked. See "Setting tol" below.
#
# All seven are about a CLAIM. The LEDGER at the foot of this file is about a STEP: it
# scans a step's whole prose and requires every number in it to be tied to something,
# whether a claim quotes the sentence or not. Three steps so far. See "THE LEDGER".
#
# The literal is stored as a STRING, exactly as written in the sentence, and is
# never produced by formatting `value`. That is deliberate: a formatter that has to
# agree with how a human wrote each sentence generates false failures and then gets
# suppressed. The two halves are checked separately and neither depends on the other.
# `shows` is stored the same way and for the same reason — but unlike `literal` it is
# compared against a formatter, so it is what the page prints and not what a human
# would have written.
#
# FIELDS
#   step       `id` of the lesson in `const LESSONS`
#   literal    the exact substring to find in that lesson's prose or expect text
#   quantity   what to measure — see `measure()` in path_claims.rs
#   value      what the engine must produce
#   tol        absolute tolerance, in `value`'s own unit. Not free: see `tol_from`.
#   tol_from   which rule `tol` follows — `spelled`, `tighter`, or `grid`. Required, and
#              checked. See "Setting tol" below.
#   spells     the number in `literal` that states this claim's quantity, written exactly
#              as the sentence writes it (`"4.030"`, not `4.03`). Required by `spelled`
#              and `tighter`, forbidden by `grid`. Only its printed places matter, so the
#              frame need not match: the prose may give a duration where the claim reads
#              an absolute time, or a magnitude where the value is negative.
#              A sentence may spell its number in LETTERS — "about three points" spells
#              `"three"` — and one does. `WORD_NUMERALS` in path_claims.rs is the
#              translation, one entry, and a word in it that no claim spells fails the
#              test. A word commits to no decimal place, so the rule it licenses is half
#              a unit of the unit it is written in: half a point, for that one.
#   spells_pow10  how many powers of ten larger `spells`'s unit is than `value`'s. 2 for a
#              prose percentage or points-of-a-hundred against a fraction; 0 otherwise,
#              which is most of them. Default 0.
#   states     which frame the sentence states this quantity in — `same`, `magnitude`,
#              `complement`, `since_mark`, `until_end`, `displayed`, `departure` or
#              `nothing`. Required, and checked. See "Stating the value" below.
#   read_at_s  simulation time the claim is read at; must be <= the step's until_s,
#              or, with `after_mark`, within the step's charge leg. ALWAYS ABSOLUTE.
#              The leg prose speaks in time-since-the-mark ("383.0 s later"); the
#              claim does not, and its note records both readings.
#   after_mark optional, default false: this claim is read on the step's charge leg —
#              after the mark, on the demand its `[[leg]]` says the reader types in.
#              Checked both ways: an `after_mark` claim on a step with no leg, or one
#              reading at or before the mark, is a claim about a run nobody made.
#              Be clear about what a leg claim's REACHABLE check is worth. Before the
#              mark the page stops at `until_s` whatever the reader does, so the check
#              is a fact about the page. After it the page stops for nothing, so the
#              leg's length is this file's own choice and a leg long enough to reach a
#              claim makes that claim reachable by construction. What is not circular
#              is the leg's `instruction`. See the CHARGE LEGS section at the foot.
#   display    optional: the readout row this claim is about, labelled as `READOUTS`
#              in web/app.js labels it (`soh cap`, `terminal`, `sim time`, ...)
#   shows      optional, and required with `display`: exactly what that row prints
#              at `read_at_s`, including its unit and spacing
#   quoted     optional, default false: the prose quotes `shows` verbatim, so the
#              test also requires that string to be in the sentence. Set it wherever
#              the sentence tells the reader to go and LOOK at the row — that is the
#              case where the sentence and the panel must agree word for word. A
#              typographic minus in the prose still matches the ASCII one a
#              formatter emits; nothing else is normalised.
#              Be clear about what this buys TODAY: in all 37 claims below that set
#              `quoted`, `shows` is a substring of that claim's own `literal`, and
#              `literal` is already required to be in the prose — so the quoted check
#              currently follows from the literal check
#              and catches nothing on its own. It is kept because it states the
#              authoring rule where a claim can see it, and because it does bite the
#              moment a sentence quotes a row string somewhere other than inside its
#              claimed literal. Do not read a green `quoted` as an independent result.
#   note       why this claim is here / what it is about. Free text.
#
# Setting `tol` — half a unit in the last printed place of the number the sentence
# spells, so the tolerance is exactly "the prose rounds to this and nothing else". A
# claim spelling `0.6387` gets 5e-5. This used to be a rule each claim re-derived by
# hand with its reasoning in `note`, and the reasoning drifted from the number twice in
# two commits (`04933c5`, `a1b0945` — both times a note citing this rule beside a
# half-step). `tol_from` makes the derivation a field, and
# `every_tolerance_follows_its_declared_rule` checks it. Three variants, and nothing
# else is accepted:
#
#   spelled  53 claims. `tol` is exactly the rule for `spells`. The ordinary case.
#   tighter  14 claims. `tol` is strictly under the rule. Needs no upper bound and is
#             given none: a smaller tolerance can only redden the test. Used for a
#             chemistry constant, for an exactly-1.0 starting point, for the two
#             `heat` claims whose stored `value` carries a place the sentence does not,
#             and for four grid times whose prose spells them to the second: half a
#             step is tighter than half a second, so those four were always pinned
#             correctly and it was only their declaration that was wrong. And for the
#             two claims on step 4's estimator gap, where the sentence's own word
#             ("three") licenses half a point and the tolerance taken is half of the
#             last place a reader could compute the gap to from the two rows behind it.
#   grid      2 claims. The quantity is a time the engine can only report on the step
#             grid (`flag_first_s:*`, `deficit_zero_s`) and the prose spells no number
#             in it — it gives a consequence, or a rendering of the clock. `tol` is
#             half a timestep, which for a grid time is the tightest meaningful bound:
#             the engine hits the claimed step or misses by a whole one. Fenced hard,
#             because this is the variant that could have re-blessed the defect it was
#             written after: no `spells`, and no number anywhere in the literal printed
#             more finely than a half-step. `**383.0 s later**` returns a grid time
#             too, and half a step there is five times looser than the tenth it prints
#             — so it is not eligible for `grid` at all.
#             The two survivors are exactly the two claims whose `states` is `nothing`
#             or `displayed`, and that is not a coincidence: a claim whose sentence
#             spells its own number takes that number's rule, however coarse the grid
#             is. Four claims were declared `grid` on the strength of "the prose spells
#             no number in it" while their own literal printed `4154 s`, `5769 s`,
#             `254 seconds` and `53 seconds` — the same shape of defect as the two the
#             `tol_from` field was introduced for, found by writing `states` and having
#             to say what each sentence states.
#
# There is no "widened" variant. Nothing in this file needs one today, and a tolerance
# looser than the sentence's own precision means the sentence is printing more places
# than the engine has — which the sentence should fix, not the tolerance. Where the
# prose hedges a round figure ("just under 14 A"), the hedge is already the loosest
# reading and `tighter` narrows it.
#
# Stating the value — `states` says how the number in the sentence relates to the
# number in `value`, and it is the check that joins the two halves of this file. Until
# it existed `literal` was a substring test against the page and `value` a comparison
# against the engine, and nothing ran between them: re-measure a drifted value, leave
# the wording alone, and everything here stayed green while the sentence was wrong. A
# drift small enough to hide inside a row's own rounding got past the display check too.
#
# The obvious fix — format `value` and require the result in the prose — is the one
# this file has refused from the start, for the reason given above about `literal`. What
# makes the tie possible instead is that English states a number in only a few frames,
# and a claim can say which one it is using. Each is checked at the SENTENCE'S precision
# (half a unit in the last printed place of `spells`), because the question is exactly
# "does the engine's number round to the one the reader is shown" — not `tol`, which
# bounds the engine against `value` and is deliberately tighter on 14 claims.
#
#   same        59 claims. The sentence prints the quantity. Prefer it: it is the only
#               variant with no second reading available to an author.
#   magnitude    2. The sentence prints the size and the sign is a word — `refused
#               0.822 A` of −0.82224 A. Fenced to negative values; on a positive one it
#               is a silent alias for `same`.
#   complement   2. The sentence prints how far below one the value is — `0.53 points
#               are gone` of a `soh cap` of 0.9947106.
#   since_mark   2. A duration since the step's mark — `**383.0 s later**` of an
#               absolute 983.0 s on a step marking at 600. Fenced to `after_mark`.
#   until_end    1. A duration remaining to the mark — `the last 53 seconds` of a flag
#               at 4146.5 s on a step ending at 4200. Fenced to pre-mark claims, which
#               with the fence above stops an author trying both frames until one fits.
#   displayed    1. The sentence prints what the ROW prints, not what the engine
#               computes: `it goes from `10m` to `16m`` of 983.0 s. No arithmetic — the
#               tie is the display check, so the claim must name a row, be `quoted`, and
#               carry that row's string inside its own literal. No `spells` allowed, or
#               the claims readable either way would be the author's pick.
#   departure    1. The sentence names a value the quantity has LEFT: the second half of
#               "`soh cap` leaves 100.00 % at t = 10 s". Asserts the opposite of `same`,
#               and cannot stand alone — an earlier claim on the same sentence, quantity
#               and number must state `same`, or "is not 100.00" would be satisfied by
#               pointing at any figure in the sentence.
#   nothing      1. The sentence prints no number about this quantity — `An `OC` flag`.
#               Checked rather than trusted: the literal must contain no digit at all,
#               which is what stops this being the escape hatch that re-opens the hole.
#
# This also closes the leverage `spells` used to have. It was required to be A number in
# the claim's literal and never the one stating that claim's quantity, so on a
# multi-number sentence an author could name the coarsest and take its tolerance. Under
# `same`, pointing the voltage claim on `The cell empties at 4146.5 s at 1.9290 V` at
# `4146.5` compares 4146.5 against 1.9290 and fails on sight.
#
# Accounting for the rest of the sentence — checks 1-5 are all about the number a claim
# NAMES. A sentence usually prints more than one. `**99.98 %** when the cell empties at
# **207.5 s and 1.9306 V**` printed three and carried two claims: the percentage and the
# voltage were each pinned to the engine, and the `207.5` was checked only as characters
# that had to still be in the prose. Move it to `210 s` in the sentence and in the
# literal together and every check in this file stayed green — which is the ORIGINAL
# hole, surviving on the one number in a claimed sentence nobody had claimed.
#
# So check 6 scans each claimed literal for numbers and requires every one of them to be
# accounted for by the claims already on that sentence. Three accountings, and no fourth:
#
#   spelled  a claim on this sentence names it in `spells` — 64 of the 73 numbers the
#            60 claimed sentences print. Signs are ignored on both sides.
#   read at  it is the instant a claim on this sentence is read at, in that claim's own
#            frame — absolute before the mark, since the mark on a leg. `99.45 % at
#            250 s` prints a health and a moment, and the moment is the `read_at_s`.
#   shown    it is inside a string this file already asserts the panel prints: a claim's
#            `shows`, or — for a `displayed` claim read on a leg — the clock's rendering
#            of the mark, which is where the leg begins and the one other instant such a
#            sentence can mean. ``it goes from `10m` to `16m`` prints both ends.
#
# NOTHING IS DECLARED HERE. The three other fields this file grew to close a hole —
# `tol_from`, `states`, `spells` — are declarations, because each encodes something a
# machine cannot decide. Every accounting above is an exact numeric fact about a claim
# sitting beside the number, so a declared one that disagreed with the fact would be a
# fresh instance of the defect `tol_from` was introduced to kill. And there is no
# "not a measurement" variant: an escape hatch is precisely what re-opens this hole, and
# the 60 claimed sentences need none. A future literal printing a control setting or a
# chemistry constant will fail loudly, and the answer will be an arm that checks it
# against the lesson block or the chemistry file — not a waiver.
#
# The `read at` accounting is the weak one and it is fenced. "We measured at 207.5" is a
# much smaller statement than "the cell empties at 207.5", and the sentence gives the
# reader the second. Measured rather than argued: deleting the flag claim this check was
# written to force left the whole suite GREEN, because the other two claims on that
# sentence read at 207.5 and the arm accounted the number as their read instant. So a
# `read at` accounting is refused at any instant the run raises a flag it did not have a
# step earlier — an event a sentence names has to be claimed. That fence lives in the
# value check, which is the only place a trajectory exists.
#
# What check 6 does NOT do is find sentences nobody has claimed at all: a step with no
# claim has no literal to scan. That is the other axis, and it is the LEDGER at the foot
# of this file — three steps of the twenty-four so far.
#
# `display` costs nothing to add and is worth adding wherever a row exists, even when
# the prose does not quote it: it is the only half of this file that knows what the
# reader can actually see. Two rows cannot be claimed — `past empty` and `surface
# gap` are formatted from per-cell state rather than telemetry, and the first of them
# is sampled on a wall clock. Naming either one fails loudly rather than passing.

[[claim]]
step = "bare-curve"
literal = "0.6387 V at the mark"
quantity = "v_at_mark"
value = 0.6387
tol = 5.0e-5
tol_from = "spelled"
spells = "0.6387"
states = "same"
read_at_s = 4200.0
display = "terminal"
shows = "0.639 V"
note = """
Step 1 runs an LFP cell past empty on purpose and the whole closing paragraph turns
on this number: the trace does not stop at the SOC_CLAMPED_LOW flag, it keeps
falling. This is the voltage at the mark, in reversal, and it is the first claim
wired into this file — the one whose two halves were each deliberately reddened
before any of the others were written. See docs/plans/path-claims.md.

Not quoted: the sentence states the engine's figure to four decimals and the row
prints three, which is a fair thing for a sentence about a *trace* to do. The
display half records what a reader who looks at the panel instead sees.
"""

[[claim]]
step = "bare-curve"
literal = "the last 53 seconds"
quantity = "flag_first_s:SOC_CLAMPED_LOW"
value = 4146.5
tol = 0.25
tol_from = "tighter"
spells = "53"
states = "until_end"
read_at_s = 4146.5
display = "sim time"
shows = "69m"
note = """
The prose does not print this flag time — it prints how long is left after it. The step
ends at 4200 s and says the cell spends "the last 53 seconds" below empty, so the
sentence and the claim are one subtraction apart and `until_end` is what performs it.
Claiming the flag time rather than the phrase is what makes the sentence checkable.
Tolerance is half a step at dt = 0.5, which is tighter than the half-second `53` would
give — this claim was declared `grid` on the grounds that its prose spells no number in
this quantity, and it plainly does.

**This one sits exactly on its rounding boundary and is admitted rather than unnoticed.**
4200 − 4146.5 is 53.5 s, and half a unit in the last place of `53` is 0.5, so the
difference is the tolerance to the last bit. 53.5 rounds to 54 under every rule there
is: the sentence is truncating, not rounding, and the check admits it only because the
window is symmetric. It could equally say 54. It is left as it reads because 53 is the
number the reader is given and the point of this file is to check what they are given —
but a sentence with no margin at all is worth knowing about, and the margin here is zero.

The display half is the clock at that instant, and it is the reason this file has a
display half at all: the flag lands at 4146.5 s and the panel says `69m`. The step's
own prose says "the knee, at about 69 minutes", which is the clock's language and
not the engine's — deliberately, and now checked.
"""

[[claim]]
step = "bare-curve"
literal = "`OPERATING_POINT_OUT_OF_WINDOW` at 4138 s"
quantity = "flag_first_s:OPERATING_POINT_OUT_OF_WINDOW"
value = 4138.0
tol = 0.25
tol_from = "tighter"
spells = "4138"
states = "same"
read_at_s = 4138.0
display = "sim time"
shows = "69m"
note = """
The first flag anyone walking this path ever sees, and it was unannounced until the
widening that produced it was measured across all twenty-four steps rather than sampled.
It arrives 8.5 s before the `SOC_CLAMPED_LOW` the claim above pins, which is the whole
reason the sentence had to change: a reader met an unexplained name before the explained
one.

Half a step at dt = 0.5, which is tighter than the 0.5 s the bare `4138` would license.
The engine can only land this flag on a step boundary, so the looser rule would admit an
answer the grid cannot produce.

The sibling claim on this step spells its flag time as a duration (`the last 53 seconds`)
and this one spells it outright. Both read the same trajectory; only the sentence differs.
"""

[[claim]]
step = "same-discharge-other-chemistry"
literal = "at 4111.5 s"
quantity = "flag_first_s:OPERATING_POINT_OUT_OF_WINDOW"
value = 4111.5
tol = 0.05
tol_from = "spelled"
spells = "4111.5"
states = "same"
read_at_s = 4111.5
display = "sim time"
shows = "69m"
note = """
The sentence this claim sits in used to say the empty-battery flag arrived with "the same
silence around it". That stopped being true when a current demand started reporting its
own operating point: this flag now precedes the counter by 42.5 s.

The lead is the lesson, not an accident of the number. Both cells cross their declared
floor before their coulomb counter reaches zero, but this one is still falling steeply
when it gets there and the LFP cell is on its plateau — 42.5 s against 8.5 for exactly the
reason the rest of the step is about. The two flag claims sit on the two steps so a
change to either trajectory breaks the comparison rather than quietly rescaling it.

`spelled`, not `tighter`: the sentence prints a tenth, so the rule it licenses (0.05 s) is
already inside half a step (0.25 s) and there is nothing to tighten.

Both this instant and step 1's render `69m` on the clock — the same minute, three quarters
of a minute apart. A reader comparing the two runs on the clock alone cannot see the gap,
which is why the sentence gives the seconds.
"""

[[claim]]
step = "same-discharge-other-chemistry"
literal = "**1.2501 V**"
quantity = "v_at_mark"
value = 1.2501
tol = 5.0e-5
tol_from = "spelled"
spells = "1.2501"
states = "same"
read_at_s = 4200.0
display = "terminal"
shows = "1.250 V"
note = """
Step 2 is the step whose numbers have drifted twice (docs/plans/path-numbers.md,
findings 1 and 2). This is its headline: the NMC cell finishes far under the 3.00 V
a datasheet calls the cutoff, because nothing here stops the discharge.
"""

[[claim]]
step = "same-discharge-other-chemistry"
literal = "It empties at 4154 s"
quantity = "flag_first_s:SOC_CLAMPED_LOW"
value = 4154.0
tol = 0.25
tol_from = "tighter"
spells = "4154"
states = "same"
read_at_s = 4154.0
display = "sim time"
shows = "69m"
note = """
Finding 1 of path-numbers.md was exactly this pair of times: the prose used to say
the two chemistries empty "within two seconds of each other" when the real gap is
7.5 s. Both ends of that comparison are now claimed — this one and bare-curve's
4146.5 above — so the comparison cannot drift again without a red test.

The clock reads `69m` here too, which is the whole of the panel's opinion on a 7.5 s
difference. The sentence is doing arithmetic the reader cannot do on the panel, and
says so by giving seconds rather than pointing at a row.

Declared `grid` until `states` was written, on a variant whose own definition is "the
prose spells no number in it" — and the literal is `It empties at 4154 s`. The half-step
is tighter than the half-second `4154` licenses, so the tolerance never moved; only the
declaration was wrong, which is the defect `tol_from` itself was introduced to stop.
"""

[[claim]]
step = "same-discharge-other-chemistry"
literal = "4.030 V to 3.549"
quantity = "v_at_soc_below:0.90"
value = 4.0299
tol = 5.0e-4
tol_from = "spelled"
spells = "4.030"
states = "same"
read_at_s = 415.5
display = "terminal"
shows = "4.030 V"
quoted = true
note = """
The upper end of the 481 mV fall that is this step's whole point: on NMC a voltage
reading tells you the charge level. Read at the first row at or below 90 % charge.

Quoted: the sentence prints the row's own three decimals, so a reader who pauses
there sees the same characters. The other end of the same sentence is not quoted —
`3.549` is written without its unit, and `shows` carries the unit because the row
does.
"""

[[claim]]
step = "same-discharge-other-chemistry"
literal = "4.030 V to 3.549"
quantity = "v_at_soc_below:0.20"
value = 3.5488
tol = 5.0e-4
tol_from = "spelled"
spells = "3.549"
states = "same"
read_at_s = 3323.5
display = "terminal"
shows = "3.549 V"
note = """
The lower end of the same fall. Sharing a literal with the claim above is deliberate:
one sentence states both numbers, so both claims point at it and either one moving
reddens the pair. The display halves are read at each end's own time, which is also
what keeps the two recorded `read_at_s` values honest: they are measured crossings,
and a shifted trajectory would leave the row rendering something else.
"""

[[claim]]
step = "belief-drifts"
literal = "A gap of about three points that simply never closes — the estimate sits above the truth from the first step to the last."
quantity = "soc_gap_pts_at"
value = 3.0651004
tol = 0.05
tol_from = "tighter"
spells = "three"
states = "same"
read_at_s = 600.0
note = """
The first claim in this file whose sentence spells its number in letters, and the reason
`spells` may now hold a word: "about three points" is the whole of what step 4 gives a
reader about the gap between what the BMS believes and what is true, and the choice until
now was between a claim that lies about its own wording and no claim at all. It went four
slices unchecked as the cheapest measurement left in the path — one run to the mark, no
reading taken with the clock stopped, no continuation.

Read at the mark, where the gap is at its widest: 3.0651 points, of which 3.0 is the boot
error the scenario file hands the BMS (`initial_soc_error = 0.03`) and the rest is the
sensor offset integrating. Its sibling below reads the other end.

Tolerance, and it is not the sentence's. Half a unit in "three" is half a point, which is
what the phrase licenses and far more than this claim needs. The panel has no gap row —
the reader subtracts `soc (bms)` from `soc (true)`, and each prints a tenth of a point —
so 0.05 is half a unit in the last place a reader can compute this quantity to at all: at
the mark the two rows read 66.2 % and 63.2 %, so the gap a reader gets is 3.0. That is
also why no `display` is named: there is no row to render, and the two rows behind it
belong to two other quantities.
"""

[[claim]]
step = "belief-drifts"
literal = "A gap of about three points that simply never closes — the estimate sits above the truth from the first step to the last."
quantity = "soc_gap_pts_min"
value = 3.0181816
tol = 0.05
tol_from = "tighter"
spells = "three"
states = "same"
read_at_s = 0.5
note = """
"Simply never closes", made checkable: the smallest the gap ever gets over the whole run,
which is 3.0182 points on the first sampled step. The claim above cannot say this — an
estimator that closed the gap at 300 s and re-opened it by the mark would pass a reading
taken at 600 s and fail this one. It is also the half that checks the rest of the
sentence, "the estimate sits above the truth from the first step to the last": a minimum
of three points is a statement about every step, not about one.

**The minimum being the first row is measured, not arithmetic.** The gap is not monotone
— the BMS's current sensor carries 10 mA of noise, so it wobbles from step to step — and
what the run shows is that the wobble never takes it below where it started. The estimate
lags the truth by a step, which is why the first row reads 3.0182 rather than the exact
3.0 of the boot error.

`read_at_s` is the instant the minimum happens at, and `measure()` asserts that rather
than ignoring it: a reduction over every row has no natural instant, and a decorative one
would let the shape of the run change under a green claim.

Tolerance and the missing `display` are the sibling's, for the sibling's reasons.
"""

[[claim]]
step = "protection-on"
literal = "just under 14 A"
quantity = "i_at"
value = 13.8207
tol = 0.2
tol_from = "tighter"
spells = "14"
states = "same"
read_at_s = 60.0
display = "current"
shows = "13.821 A"
note = """
The prose says "just under 14 A" rather than printing the figure, so the literal
check guards the phrase and the tolerance says what "just under 14" is allowed to
mean. If the derate ever lands at 12 A or 15 A the phrase is wrong and this goes red;
small solver drift will not chatter it.

Marked `tighter`, which this note used to get backwards — it opened "a deliberately
loose one", and 0.2 A is not loose against the rule: a bare `14` gives half a unit of
0.5, so this is under half of what the sentence would license. The looseness it meant
is against the *row*, which is a different comparison and the one that matters here.
`tol` is two hundred times the last digit the `current` row prints, so the value check
cannot see the panel change at all — which makes this the clearest case in the file
for the display half being a separate check rather than a tighter tolerance, and the
one claim where it is demonstrably not implied by the value check.
"""

[[claim]]
