# twenty-four entries above amount to: every step of the guided path now has its whole
# prose scanned, not only the sentences a claim quotes. Of the steps below, those that
# carry claims: none of them. Unchecked entirely: none. Both sentences are derived and
# both now say the same thing.
#
# The list stays in the file rather than being deleted, because it is the mechanism by
# which a step SAYS it is not checked — a new lesson that cannot be ledgered on the slice
# that adds it belongs here, named, with its claim count beside it.
# `every_lesson_is_ledgered_or_named_as_not` requires every lesson to be in exactly one of
# the two lists, so silence is not an option; an empty list is a statement and not an
# omission. What it does NOT say is that the path is checked: a green ledger says every
# DIGIT is tied to something, and this path states a great many of its quantities in
# English words that no scan here can see.
