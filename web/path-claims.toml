# whole run — a flag's arrival, an amp-hour total, a minimum — is refused rather than
# answered from the stepped rows behind the claim's back.
#
# THREE FENCES, in `every_probe_claim_is_taken_before_the_run`: `read_at_s` must be 0, the
# claim may not name an `arm`, and the step must set `reload: true`. The last is the
# one worth naming — the harness always builds a fresh pack, which a stepped trajectory
# mostly absorbs, but the probe IS the fresh pack. On a step that inherits its pack from
# whichever step the reader arrived from, there is no fresh reading to claim.

[[claim]]
step = "the-gradient-itself"
literal = "Both numbers read **0.00 / 0.00** before you press Run, beside 3.927 V and 100.0 %"
quantity = "surface_gap_neg_pts"
value = 0.0
tol = 5.0e-3
tol_from = "spelled"
spells = "0.00"
states = "same"
read_at_s = 0.0
probe = true
display = "surface gap"
shows = "0.00 / 0.00 pts"
note = """
The first claim in this file read on the zero-length probe, and the step's own headline:
this row is what step 17 exists to put on the panel, and the sentence a reader meets first
is about what it says before anything has happened.

The value is a true zero in the sense the sentence means — a particle nobody has asked for
a current has no gradient — and it is NOT a hard zero in the float. The engine reads
-1.11e-16 here, because the bulk side of the difference goes through a volume-weighted
mean that sums and divides while the surface side returns the outermost shell untouched.
`toFixed` on that prints `-0.00`. The page has a guard that spells it `0.00` and this file
mirrors the guard, so the display half of this claim asserts `0.00 / 0.00 pts` against the
MIRROR — and a hand mirror is only as good as what ties it to the page. Measured: deleting
the guard from `web/app.js` left the whole suite green, because the mirror kept printing
what the page no longer printed. What holds the page to it is `MIRRORED`, which now pins
the guard's own source line beside the row's. Read this claim as "the row prints
`0.00 / 0.00 pts`", and `mirrored_constants_still_match_the_page` as the reason that is a
statement about the page rather than about this file.

Not `quoted`: the row prints `0.00 / 0.00 pts` and the sentence gives the two numbers
without the unit, which is fair for a sentence that has just named the unit twice.
"""

