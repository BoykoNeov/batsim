ambient_c = -5.0
bms = false
actions = [{ do = "run", to_s = 4100.0 }]
note = """
The same cold pack with the checkbox cleared, which is the second half of the sentence.
Both overrides are anchored in it — the −5 as a number, the BMS by name — and both are
genuine changes from what the step configures (25 °C, protection on).

`restart` is forced here for a second reason on top of the ambient's: the page's BMS
checkbox clicks Reset, so a mid-run toggle is not a thing the page can do at all.

What this arm shows past its claim is the sentence's last clause, "with the charge carrying
on regardless": the current stays at the full −3 A through the flag and the pack reaches
95.7 % by the mark, where the protected arm stopped dead at 60.75 %. No claim reads it —
the prose gives no number for it — so it is recorded here rather than asserted.
"""

