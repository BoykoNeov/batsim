what a reader sees *change* at the trip is the IR drop and not imbalance, which is what it
is arguing against; it is wrong if read as "the gap IS the IR drop". Left as prose rather
than rewritten, because the two readings differ only in whether "the 130 mV gap" is the
subject of "is" or the thing the change is measured on — and no number moves either way.

Not the cell spread, which is 10.4 mV here and 11.0 mV a step earlier: the trip barely
touches it, which is the sentence's actual point.
