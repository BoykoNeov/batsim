[[claim]]
step = "what-protection-costs"
literal = "the BMS derates it to exactly 4.2 A"
quantity = "i_at"
arm = "one C"
value = -4.2
tol = 5e-4
tol_from = "tighter"
spells = "4.2"
states = "magnitude"
read_at_s = 0.5
