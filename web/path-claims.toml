display = "soh cap"
shows = "98.94 %"
note = """
The same reading as the claim above on "at the mark it is 1.06", and claimed twice on
purpose: check 6 is positional, so a number is accounted only inside the literal of the
sentence whose claims account for it. This sentence restates the first leg's cost in order
to divide by it, and a sentence doing arithmetic on a number has to have that number
pinned — otherwise the derivation below says only that two unpinned figures make a third.

Step 6 set the precedent: it states its clamped current in two sentences, and closing the
second one meant claiming it rather than waiving it.
"""

[[derived]]
step = "wearing-out-while-idle"
literal = "20 K buys 2.84 points over the next 200 000 s against the 1.06 the first leg cost, about 2.7×"
spells = "2.7"
op = "ratio"
from = ["2.84", "1.06"]
note = """
The file's first derivation. It is CHECK 6's arm, not the ledger's: the `Derived` row in
docs/plans/path-prose-ledger.md's taxonomy is a tie over a ledgered step's whole prose, and
that one is `Tie::Derived`, built one slice later for step 22's "six of these in series is
the 12 V battery". `setting` already lives in both scans for the same reason, and so does
this.

What is declared here is where to read the two operands and what the sentence does with
them. The value is not: 2.84 / 1.06 is recomputed and compared at the one decimal place the
prose commits to. Both operands are claims on this same sentence, so the ratio is tied to
the engine through them — that requirement is the arm's floor, and it is checked.

Worth recording, because it is the reason this rounds cleanly either way: the engine's own
ratio is 2.8375 / 1.0579 = 2.6822, and the printed numbers give 2.6792. Both are 2.7 to a
tenth. A sentence whose two readings straddled a rounding boundary would be a sentence to
reword, not a tolerance to widen.
"""

# --- step 8's third trajectory: the same heat, from new ---------------------------
#
# The step's closing sentence has always said what two FRESH packs would show, and until
# this arm the number was true of a run nobody could produce: the prose instructed a
# continuation at the mark and nothing else, so 3.5x was measured on a trajectory the reader
# is not shown. That is the "right but unreachable" class, and the fix is an instruction
# rather than a deletion — Restart at 45 degC is one keystroke away from where the sentence
# already leaves the reader.

[[arm]]
step = "wearing-out-while-idle"
name = "hot from new"
instruction = "press **Restart** with the slider still at 45 °C"
start = "restart"
ambient_c = 45.0
actions = [{ do = "run", to_s = 200000.0 }]
note = """
A fresh pack at 45 °C for one leg's worth of rest, which is the other half of the
comparison the step's last sentence makes. `Restart` rebuilds from the scenario and does
NOT re-apply the step's controls, so the slider stays where the reader dragged it — the
page's own behaviour, and why this arm needs no second instruction to put it back.

Run length is the sentence's own: "the same 200 000 s", which is this step's mark, so the
arm ends where the first leg ended and the two losses are comparable by construction.

Measured on the way in, and it is why the sentence says 3.5 rather than the 3.6 the
scenario file's header says: over a 200 000 s leg the fresh 45 °C pack loses 3.7489 points
against 1.0579 at 25 °C, a ratio of 3.5439. The pure Arrhenius factor for +20 K on this
chemistry's activation energy is 3.5535, and the file's 3.6 is that ratio over a 600 ks run.
The difference is the warm-up: both packs start at 25 °C, `√t` weights the first minutes
heavily, and the hot one spends its first few hundred seconds climbing to its own rate. A
longer run dilutes that, which is why the same comparison rounds differently at 600 ks.
"""

[[claim]]
step = "wearing-out-while-idle"
literal = "the same 200 000 s costs **3.75 points** from new"
quantity = "soh_cap_at:200000"
value = 0.9625106
tol = 5.0e-5
tol_from = "spelled"
spells = "3.75"
spells_pow10 = 2
states = "complement"
read_at_s = 200000.0
arm = "hot from new"
display = "soh cap"
shows = "96.25 %"
note = """
The fresh pack's loss over one leg, and the operand the closing ratio divides. `complement`
because the sentence prints what is gone and the row prints what is left — the same frame as
the 1.06 above it, on the other trajectory.

The instant is 200 000 s of the ARM's own clock, which starts at zero: a restart arm covers
the same instants as the step's own run and answers differently there, which is why the
quantity is tagged and why `Tie::Quoted` takes the arm as part of the address.
"""

