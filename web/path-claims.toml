# `dt = 0` whenever the demand-mode dropdown changes, so a reader who paused at the exact
# instant the current stopped and switched the mode to `Rest` would see this number — but
# pausing there is not something the page makes easy and the prose does not ask for it.
# These claims name no `display` for that reason, on the same terms as `delivered_ah`: they
# are about the model, and no row shows a difference between two instants anyway.
