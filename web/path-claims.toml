WHY THE READER IS TOLD TO PRESS RUN AGAIN. At the mark the unprotected charge is still
taking 2.1 A — nowhere near the 0.3 A cutoff — so a reader who stops at the mark sees a run
that has not finished and no comparison at all.

`magnitude`, because the page's sign convention is discharge-positive and this is a charge:
`i_actual` is -2.0754 A and the sentence writes the direction in the word *pushing*. The
same variant, for the same reason, as step 4's sensor gap.

No `display`: the `current` row prints what the pack is doing to a different precision than
this sentence does, and a claim quoting a row it has not asserted would be pinning a
