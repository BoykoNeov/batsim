# The same gauge, with a model of the cell, lower down the curve. Sodium-ion near empty.
#
# Everything below the [meta] table is `na_ion_gauge_low.toml` character for character, with ONE
# section added at the end: [pack.bms.estimator.Ekf]. Same chemistry, same pack, same
# seed, same sensor offset and noise, same boot error. Only the way the BMS turns its
# readings into a charge estimate differs. See docs/plans/model-based-estimator.md.
#
# Booted 3 points high, discharged at 1 C for 300 s, then rested for 3600 s, at
# dt = 0.5 s (the browser page's default), 25 degC. Estimate minus truth, in points of
# charge, with the partner file's coulomb counter beside it. `sigma` is the filter's own
# opinion of how wrong it is, in points.
#
#                  at 30 s    discharge ends    rest ends    sigma at the end
#   counter        +3.0025           +2.9001      -0.9753                   -
#   filter         +0.0050           -0.6012      -1.0015              0.0131
#
# The wider loop down here costs the filter what it costs the rest read: it ends a point
# low, twice the mid-range figure, and within three hundredths of the counter. A model
# without the loop reads it as charge, under load and at rest alike. With the chemistry's
# [hysteresis] section removed the same file ends at -0.064 points.

chemistry = "na_ion_18650_generic"

[meta]
name = "A gauge with a model, sodium-ion near empty"
description = """
`na_ion_gauge_low.toml` with one section added: a Kalman filter over a model of the cell \
instead of counting. It closes the 3-point boot error within half a minute, and then ends \
about a point low, as the counter does, because this cell's voltage memory is wider near \
empty and the model does not know it is there."""

[pack]
series = 1
parallel = 1
# The ONE field that differs from `na_ion_gauge_corrects.toml`. 300 s at 1 C moves 8.3333
# points, so this run rests at 16.6667 % — far enough below the table's 0.35 breakpoint for
# the multiplier to be 2.5714 there, and far enough above empty that the `[reversal]` ramp
# and the under-voltage limit are both a long way off.
initial_soc = 0.25
initial_temp_k = 298.15
# The current sensor's noise is drawn from the pack RNG, so the seed is load-bearing rather
# than merely named: this file and the twin use the same one so the two runs see the same
# noise.
seed = 20260831

# Omitted below, and each omission means "off", not "on with defaults". Identical to the
# twin's list and for the twin's reasons:
#   [pack.scatter]  -> every cell identical; one cell, so there is nothing to scatter
#   [pack.thermal]  -> Isothermal. R0 falls as a cell warms, which would move the resting
#                      voltage the correction is read from
#   [pack.aging]    -> the pack never wears out; over an hour it would not anyway
#   [[faults]]      -> nothing scheduled. The sensor error below is CONFIGURATION, not a
#                      fault: it is what an honest sensor costs, present from step 0

[pack.bms]
# Every number in this section is identical in `na_ion_gauge_corrects.toml` and in
# `lfp_gauge_declines.toml`.
#
# 20 mA against this cell's 1.4558 A discharge is 1.37 %, and because coulomb counting
# integrates it, it is worth 0.100 points of charge over the five-minute leg.
current_offset_a = 0.02
current_noise_sigma_a = 0.01
# One probe for one cell. The estimator does not read temperature; this is here because
# protection does.
temp_probes = [[0, 0]]
# A BMS that has just been powered on does not know what it is holding. Three points is the
# error the correction exists to remove.
initial_soc_error = 0.03
rest_current_threshold_a = 0.05
rest_time_for_ocv_s = 600.0
ocv_correction_gain = 0.1
# The gate. Below this slope an OCV reading is noise amplification and the estimator
# declines. This run rests where the curve reads 2.3960 V per unit — 16 times over it, and
# steeper than the twin's 1.9100, which is the half of this lesson that works the other way.
min_ocv_slope_v_per_soc = 0.15

[pack.bms.protection]
v_hard_margin_v = 0.15
t_hard_margin_k = 10.0

[pack.bms.estimator.Ekf]
# THE one section this file adds to its partner. What the filter ASSUMES, not what the
# sensors do -- the sensor model above is unchanged. Each is a tuning choice, not a
# property of any cell; provenance: placeholder, chosen by hand for this lesson, not fitted.
#   current_sigma_a   -- 0.05 A, two and a half times the sensor's real 0.01 A of noise,
#                        because the filter has no state for the 0.02 A offset and has to
#                        cover it somehow
#   voltage_sigma_v   -- 10 mV. The voltage sensors are exact, so this is the filter's
#                        allowance for its own model being wrong: the loop it does not
#                        model, the resistance it may have wrong
#   initial_soc_sigma -- 5 points: it knows it booted unsure, not how unsure it should be
current_sigma_a = 0.05
voltage_sigma_v = 0.010
initial_soc_sigma = 0.05
