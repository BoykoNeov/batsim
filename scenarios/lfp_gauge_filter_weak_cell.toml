# A model-based gauge whose model is wrong, on the curve where that costs the most. LFP.
#
# `lfp_gauge_filter.toml` with ONE entry added -- the [[faults]] at the end, a cell whose
# R0 is 20 % above the chemistry's table from the first step. Everything else, the filter's
# tuning included, is that file character for character. See
# docs/plans/model-based-estimator.md, prediction 7.
#
# At 1 C the extra resistance costs about 0.2 * 0.0205 ohm * 2.303 A, 9.4 mV: the cell's
# terminal voltage sits that much below what the filter's model predicts. On sodium-ion's
# 1.9 V per unit that would be half a point. On this plateau, at 0.022-0.057 V per unit, it
# is worth more than ten.
#
# Booted 3 points high, 1 C for 300 s, then rest for 3600 s, dt = 0.5 s, 25 degC. Estimate
# minus truth in points; the counter row is the same pack and fault with the estimator
# section removed:
#
#                  at 30 s    discharge ends    rest ends    sigma at the end
#   counter        +3.0067           +2.9420      +2.0574                   -
#   filter        -14.7430          -11.4428      -6.6661              0.0646
#
# Two things to take from it. Under load the filter is fifteen points wrong where the
# counter, which never looks at the voltage, is three -- a model-based estimator is only as
# good as its model, and a flat curve multiplies every millivolt the model misses. And at
# rest, when the current and with it the model's error go away, the filter does NOT come
# back: while it was wrong under load it became sure of itself (sigma 0.14 points at the
# end of the discharge, 0.065 at the end of the rest), so it now gives each reading almost
# no weight. Confidently wrong, by a hundred times its own error bar.

chemistry = "lfp_26650_generic"

[meta]
name = "A gauge with a wrong model, LFP"
description = """
`lfp_gauge_filter.toml` with the cell's resistance 20 % above what the chemistry's table \
says -- an aged or badly made cell -- and nothing else changed. The filter's model reads \
the table, so under load it expects more voltage than it sees and concludes the cell is \
emptier than it is: about 15 points low within half a minute, still almost 7 low after an \
hour's rest, while the plain counter on the same cell would sit 2 to 3 points high. Watch \
how sure the filter is of itself while it is that wrong."""

[pack]
series = 1
parallel = 1
# Inside this cell's flat plateau, and a 1 C discharge from here stays inside it for the
# whole run -- which is what makes the refusal a fact about the curve rather than about
# where on the curve the run happened to stop.
initial_soc = 0.60
initial_temp_k = 298.15
# The current sensor's noise is drawn from the pack RNG, so the seed is load-bearing here
# rather than merely named: both files use the same one so the two runs see the same noise.
seed = 20260831

# Omitted below, and each omission means "off", not "on with defaults":
#   [pack.scatter]  -> every cell identical; one cell, so there is nothing to scatter
#   [pack.thermal]  -> Isothermal. Deliberate: R0 falls as a cell warms, which would move
#                      the resting voltage the correction is read from and make the two
#                      chemistries differ for a second reason
#   [pack.aging]    -> the pack never wears out; over ten minutes it would not anyway, and
#                      a health row that cannot move invites a stronger conclusion than the
#                      run supports
#   [[faults]]      -> nothing scheduled. The sensor error below is CONFIGURATION, not a
#                      fault: it is what an honest sensor costs, present from step 0, and
#                      it is the thing the correction has to undo

[pack.bms]
# Every number in this section is identical in `na_ion_gauge_corrects.toml`.
#
# Sensor error the BMS cannot know about. 20 mA against this cell's 2.303451 A discharge is
# 0.87 %, and because coulomb counting integrates it, it is worth 0.058 points of charge
# over the five-minute leg — small beside the boot error below, and the mechanism that runs
# away over a long drive. The partner file's cell is smaller, so the same offset costs it
# 0.100 points over the same five minutes; the FIELD is identical and what it buys is not.
current_offset_a = 0.02
current_noise_sigma_a = 0.01
# One probe for one cell. The estimator does not read temperature; this is here because
# protection does.
temp_probes = [[0, 0]]
# A BMS that has just been powered on does not know what it is holding. Three points is the
# error the correction exists to remove, and it is what makes the difference between the two
# chemistries legible in the first place: without it both estimates would start correct and
# there would be nothing to correct.
initial_soc_error = 0.03
rest_current_threshold_a = 0.05
rest_time_for_ocv_s = 600.0
ocv_correction_gain = 0.1
# The gate. Below this slope an OCV reading is noise amplification and the estimator
# declines. This cell's plateau sits under it, which is the whole point of this arm.
min_ocv_slope_v_per_soc = 0.15

[pack.bms.protection]
v_hard_margin_v = 0.15
t_hard_margin_k = 10.0

[pack.bms.estimator.Ekf]
# THE one section this file adds to its partner. What the filter ASSUMES, not what the
# sensors do -- the sensor model above is unchanged. Each is a tuning choice, not a
# property of any cell; provenance: placeholder, chosen by hand for this lesson, not fitted.
#   current_sigma_a   -- 0.05 A, two and a half times the sensor's real 0.01 A of noise,
#                        because the filter has no state for the 0.02 A offset and has to
#                        cover it somehow
#   voltage_sigma_v   -- 10 mV. The voltage sensors are exact, so this is the filter's
#                        allowance for its own model being wrong: the loop it does not
#                        model, the resistance it may have wrong
#   initial_soc_sigma -- 5 points: it knows it booted unsure, not how unsure it should be
current_sigma_a = 0.05
voltage_sigma_v = 0.010
initial_soc_sigma = 0.05

[[faults]]
# THE one entry this file adds to `lfp_gauge_filter.toml`. At t = 0, so the cell is like
# this from the first step: its own capacity, and R0 20 % above the chemistry's table.
# The filter reads that table, so its model of the cell is now wrong by exactly this much.
at_s = 0.0
fault = { WeakCell = { s = 0, p = 0, capacity_factor = 1.0, r0_factor = 1.2 } }
