# The same short, three times weaker, and a BMS with nothing to clamp.
#
# The twin of `external_short_30_milliohm.toml`: same pack, same seed, same fault at the
# same instant, and the only difference between the two files is `ohms`. Three times the
# resistance is a third of the sag, and a third of the sag does not reach the hard
# voltage margin — so the voltage rung of the protection ladder never fires.
#
# Neither does the other rung, and that is the point of this file. The first response to
# an excursion is to derate: shrink the window of current the *demand* is allowed. A
# short is not a demand. The demand here is `Rest`, and 86 A flows anyway, because a
# conductance across the terminals is not something a clamp on `i_req` can reach.
#
# What stops it is the thermal path, 96 s later and half the charge gone: the pack heats
# itself with its own resistance until a probe crosses `t_max_k` + 10 K and the contactor
# latches. Compare `pack.bms` removed: the trajectory is the same until that instant, and
# then it simply carries on.
#
# EVERY NUMBER IN THIS HEADER IS A SECOND COPY, and nothing compares it with the first.
# The guided path's step 19 is about this file and states the same figures, where they are
# claimed against the engine one by one (`web/path-claims.toml`); this header is prose in a
# file no check reads. Two of them had already parted when that step was scanned whole —
# "95 s later" against a contactor that opens 96 s after the fault, and a latch stated at
# t = 155.5 s, which is the frame the probe crosses on and not the frame the flag appears
# on. Both are corrected above and below. Reconciled by hand on 2026-08-17 and unguarded
# after it, which is the shape that produced a ratio asserted three times in two files and
# wrong in both (`docs/plans/path-ledger-last-two-steps.md`).

chemistry = "lfp_26650_generic"

[meta]
name = "external short, 100 milliohm"
description = """
4S2P LFP at 90 % charge, resting, thermally coupled, with a protective BMS. At \
t = 60 s a 100-milliohm short appears across the pack's load-side terminals. The groups \
sag to 2.13 V — above v_min, so not even a soft under-voltage — and no flag of any kind \
is raised for 73.5 s. The contactor eventually latches at t = 156.0 s on over-temperature, \
by which time the pack has gone from 90 % to 39.6 %."""

[pack]
series = 4
parallel = 2
initial_soc = 0.90
initial_temp_k = 298.15
# Same seed as the twin. The two files are a controlled pair or they are nothing.
seed = 20260727

[pack.scatter]
capacity_sigma = 0.02
r0_sigma = 0.03

# Load-bearing here in a way it is not in the twin: this scenario's trip comes from the
# thermal network, so an isothermal pack would never stop at all.
[pack.thermal.Network]
k_neighbor_w_per_k = 0.5

[pack.aging]
sub_clock_period_s = 10.0

[pack.bms]
current_offset_a = 0.02
current_noise_sigma_a = 0.01
# Both probes are on corner cells, and the trip is a probe crossing 343.15 K. Ground
# truth's hottest cell is at 344.52 K when that happens — the BMS is late by 1.3 K of
# somebody else's temperature, which is the whole argument for `soc_bms` and `t_probe`
# being different quantities from `soc_true` and `t_max`.
temp_probes = [[0, 0], [3, 0]]
initial_soc_error = 0.03
rest_current_threshold_a = 0.05
rest_time_for_ocv_s = 600.0
ocv_correction_gain = 0.1
min_ocv_slope_v_per_soc = 0.15

# Identical to the twin's. The margins are not what differs — the fault is.
[pack.bms.protection]
v_hard_margin_v = 0.15
t_hard_margin_k = 10.0

[pack.bms.balancing]
bleed_r_ohms = 33.0
v_threshold_v = 3.45

[[faults]]
at_s = 60.0
fault = { ExternalShort = { ohms = 0.10 } }
