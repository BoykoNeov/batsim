# `nimh_overcharge.toml` with the temperature pinned. The control arm.
#
# This file differs from its twin by ONE thing: [pack.thermal.Network] is gone, so the
# cell reports its heat and never moves in temperature. Everything else -- chemistry,
# topology, starting charge, ambient, seed -- is identical.
#
# ## Why the control is necessary, and why the obvious one is worthless
#
# docs/plans/phase-8-slice-c-spike.md measured that a peak-then-fall is STRUCTURALLY
# GUARANTEED once a cell stops taking charge: the open-circuit voltage stops climbing while
# the charger keeps pushing, so on any chemistry whose resistance falls with temperature
# the terminal must turn over. "It peaks and it falls" is therefore a fact about the charge
# stopping and evidence about nothing. Only the magnitude counts, and a magnitude needs
# something to be measured against.
#
# This is that something. With the temperature pinned neither channel can act -- R0(T) is
# frozen and the OCV temperature correction has a zero temperature difference to work with
# -- and the terminal NEVER TURNS OVER. Measured at the page's dt = 0.5:
#
#   * t = 3186.5 s   the cell passes the onset at 1.493723 V; the refusal begins
#   * t = 3300.0 s   1.515559 V, where its twin peaks at 1.510460 V
#   * t = 3448.5 s   1.518405 V, printing 1.518 V. Its twin is at 1.505 V here.
#   * t = 3600.0 s   1.518588 V, printing 1.519 V, and still creeping toward 1.518600 V
#
# The creep is the storage trickle: the taper in the chemistry file never reaches full, so
# a sliver of current is always still lifting the open-circuit voltage, and with nothing
# warming there is nothing to pull the terminal back. `with_temperature_pinned_the_fall_is_
# exactly_zero` pins the whole trace as monotone non-decreasing. So whatever the twin's
# fall is, it is temperature and nothing else.
#
# ## One honest wrinkle
#
# This cell reads HIGHER than the live twin at every instant past the onset -- 1.518 V
# against 1.505 V at the +10 K mark. That is not an inconsistency. The live cell warms
# 5.8 K before it peaks, so it arrives at its peak with some of the fall already spent, and
# goes on warming afterwards. The pinned cell spends none of it, which is what makes it the
# reference. Note that the two cells' `clamp` rows agree to the bit at every instant: the
# taper reads stored charge and nothing else, and the coulomb count cannot see temperature.
#
# ## Everything else this file does not do
#
# As its twin: no BMS, no scatter, no faults, and no aging (which would be a build error
# against a chemistry that ships no [aging] section). The ambient control does nothing at
# all on this file, which is worth knowing before dragging it -- the cell sits at
# initial_temp_k whatever the slider says, exactly as `cc_discharge_lto.toml` and every
# other isothermal scenario here does.

chemistry = "nimh_subc_3ah_generic"

[meta]
name = "Overcharge, single NiMH cell, temperature pinned"
description = """
`nimh_overcharge.toml` with [pack.thermal] removed, so the cell reports its heat and \
never warms. Charge at 1 C into the same overcharge and the terminal climbs toward 1.519 V \
and never turns over: the fall its thermally live twin shows is exactly zero here, and the \
trace is monotone to the last step. The control arm for the -dV lesson -- whatever the \
twin loses, it loses to temperature."""

[pack]
series = 1
parallel = 1
initial_soc = 0.1
initial_temp_k = 298.15
seed = 0

# Omitted below, and each omission means "off", not "on with defaults":
#   [pack.thermal]  -> Isothermal: heat is reported, temperature never moves. THIS IS THE
#                      ONE DIFFERENCE FROM `nimh_overcharge.toml`.
#   [pack.scatter]  -> every cell identical; one cell, so there is nothing to scatter
#   [pack.bms]      -> no BMS at all
#   [pack.aging]    -> would be a build error against this chemistry
#   [[faults]]      -> nothing scheduled
