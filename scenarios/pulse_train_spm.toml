# The first scenario in this repo that selects the single-particle model.
#
# `sim-core` has carried a porous-electrode cell model since Phase 6 — 900 lines,
# validated against PyBaMM to 2.6 / 6.7 / 1.9 mV over three scenarios — and until this
# file no client could reach it, because `cell_model` is settable only from a scenario
# and not one of the eight files here set it.
#
# That sentence was true of *both* porous-electrode models when it was written, and it is
# now true of only this one: `cc_discharge_3c_dfn.toml` did the same job for the
# Doyle-Fuller-Newman cell one slice later. Read literally the claim still holds — this is
# the file that made `Spm` reachable — but "the porous-electrode model" is no longer a
# definite description, and the pair at 3 C is where the two of them are compared.
#
# This is `pulse_train_ecm.toml` with `[pack.cell_model.Spm]` added and nothing else
# changed. Same cell, same 90 % SOC, same everything: one field is the whole difference,
# which is what makes what you see attributable to the model rather than to the setup.
#
# ## Which half of the chemistry file this reads
#
# The [spm] half — every value a key of PyBaMM's Chen2020, a literal inside one of its
# functions, or a stated product of two keys, regenerable by tools/reference/extract_spm.py.
# Nothing in it is fitted. The sibling ECM run reads [r0] and [[rc]], which that file
# labels as placeholders. **The two arms are therefore not equally trustworthy**, and
# the comparison is written in ratios rather than millivolts for that reason: a ratio
# survives a placeholder that a magnitude does not.
#
# ## What the pulse train shows, measured at 1 C = 5.153 A, 25 degC
#
# The circuit's answer to a pulse is one shape scaled by one number. This cell's is not:
#
#   * first pulse — 135.7 mV of sag: 113.9 mV returns the instant the current stops
#     (the kinetic overpotential, which is zero at zero current; this parameter set's
#     `contact_resistance_ohm` is Chen2020's own 0, so there is no ohmic term at all),
#     17.3 mV climbs back slowly as the concentration gradient flattens, and 4.6 mV has
#     not returned when the rest ends. (4.6 and not the 4.5 this file and the guided path
#     both used to say: 135.7 - 113.9 - 17.3 is exactly 4.5, so that figure had been
#     subtracted from the three ROUNDED parts instead of measured. The engine says 4.559.
#     Corrected in both places by crates/sim-data/tests/path_claims.rs, which now pins it.)
#     That last figure is NOT the clean open-circuit
#     step its sibling file's 5.3 mV is: this rest is still climbing at 600 s, so it is
#     charge that has left *and* gradient that has not finished flattening, mixed. Which
#     is the whole point of the next line;
#   * that slow rebound is 17.3 mV on the first pulse and **37.2 mV on the fifth**, and
#     still growing. 600 s of rest does not undo 60 s of diffusion, so gradient carries
#     over from one pulse to the next. The cell remembers the earlier pulses. The
#     circuit's rebound is 74.8 mV on all five, identical to four decimals.
#   * ask for 3 C and the two parts scale in **opposite directions**: the fast part
#     saturates at x1.87 (Butler-Volmer's asinh), the slow part accelerates to x6.02
#     (the OCP is a nonlinear function of surface stoichiometry). They sum to x2.48,
#     which merely looks mildly sub-linear and hides both. The circuit answers x2.99 and
#     x3.00 to the same question, because that is what linear means.
#
# See docs/plans/spm-scenario.md for the whole table and for the three candidate
# experiments the measurement killed on the way to this one.
#
# ## Two limitations, named rather than avoided
#
# * Do not drive this past the SOC clamp. Both models stay finite there, but neither is
#   describing a cell any more. Measured on the guided path's train (60 s on, 600 s off,
#   3 C) past the clamp at 11 880 s: this model's terminal falls to 0.309467 V at the
#   bottom of every loaded leg -- the same value each time, because the surface
#   concentration has run off the bottom of the OCP table and the table's last entry is
#   what it reads -- and climbs back over each rest, though not to the same place twice:
#   1.195187 V at the end of the first rest below the clamp, 1.171316 at the end of the
#   next and 1.147446 at the end of the one after, about 24 mV lower each cycle because
#   charge is still leaving. Same family as the
#   overcharge hole: a hole in the model, left visible.
#
#   The CIRCUIT does something different and not worse: its open-circuit voltage falls
#   through the [reversal] ramp its chemistry file declares and stops on the floor the
#   same file declares, so its teeth settle at -0.442 V at the start of each loaded leg
#   and -0.657 V at the end. This paragraph said "stops at 1.79 V" until 2026-08-25,
#   which was true before `[reversal]` existed (v13->14) and had not been re-measured
#   since; the guided path's step 14 now pins all four of these figures.
# * `shells = 20` is `spm::DEFAULT_SHELLS`, chosen in Phase 6 by the accuracy curve
#   (flat past 20, cost linear at 29.4 ns/shell). It is a cost knob, not a property of
#   the material, and it is part of the snapshot layout — which is why it is written out
#   here rather than defaulted.

chemistry = "nmc_21700_lgm50"

[meta]
name = "Pulse train, single-particle model"
description = """
A 1S1P LG M50 cell at 90 % SOC and 25 degC, isothermal, no BMS, no aging, no faults, \
running the porous-electrode model on parameters extracted verbatim from PyBaMM's \
Chen2020. `pulse_train_ecm.toml` with one field added. Drive it with the client's pulse \
mode (60 s on, 600 s off): the rebound after each pulse grows from 17.3 mV to 37.2 mV \
across five, where the circuit's is identical every time, and three times the current \
buys x1.87 of the fast part and x6.02 of the slow one."""

[pack]
series = 1
parallel = 1
initial_soc = 0.90
initial_temp_k = 298.15
seed = 1

# The one field. Everything else in this file is `pulse_train_ecm.toml` verbatim.
[pack.cell_model.Spm]
shells = 20

# Omitted, and each omission means "off":
#   [pack.scatter] / [pack.thermal] / [pack.bms] / [pack.aging] / [[faults]]
