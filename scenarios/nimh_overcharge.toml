# A NiMH cell charged until it is full, and then charged some more.
#
# This is the file `CLAUDE.md`'s "NiMH (-dV, hysteresis)" was asking for on the -dV half.
# A nickel cell held on a constant current past full does something no lithium cell in
# this repo does: its terminal voltage stops rising, turns over, and FALLS. That fall is
# how nearly every NiMH fast charger on earth decides to stop, and it has to come out of
# the physics rather than out of a script — which is Phase 8's fourth exit criterion.
#
# ## Where the fall comes from, and what is NOT in it
#
# Over the last 1.5 % of its capacity the cell stores a falling share of the current --
# [charge_acceptance] in the chemistry file, SNAPSHOT_VERSION 21 -- and turns the rest into
# heat (SOC_CLAMPED_HIGH, and the `clamp` readout printing what it refused). The engine
# bills the refused charge as heat -- see docs/plans/energy-hole.md -- so most of the
# charger's power ends up in a cell that has nowhere to put it. The cell warms, and warming
# reaches the terminal by exactly two channels:
#
#   * R0(soc, temp_k) falls as the cell warms, so the ohmic rise above the open-circuit
#     voltage shrinks. Available since Phase 0.
#   * the open-circuit voltage itself falls, through dU/dT and the [ocv] table's t_ref_k.
#     Added in SNAPSHOT_VERSION 18; docs/plans/phase-8-slice-c-hysteresis.md.
#
# Measured on this file at the page's own dt = 0.5, the two are worth about 40 % and 60 %
# of the fall respectively (crates/sim-data/tests/nimh_chemistry.rs).
#
# The taper is the third mechanism, and it is what makes the peak a DOME. Through
# SNAPSHOT_VERSION 20 this cell had no charge-acceptance model: the coulomb counter clamped
# at full and refused everything from one step to the next, so the slope of the terminal
# reversed in a single timestep and the peak was a corner. docs/plans/phase-8-slice-c-spike.md
# measured that and cut the fix; docs/plans/charge-acceptance.md built it. Two things about
# it are worth knowing before reading numbers off this file:
#
#   * the cell never reaches 100.0 % -- it approaches it, and `soc (true)` reads 99.8 % at
#     the peak and rounds to full about a minute later;
#   * the fall at the +10 K mark is SMALLER than it was at a clamp (5.933 mV against 8.772),
#     because a cell still storing a trickle is still lifting its own open-circuit voltage
#     while temperature pulls the terminal down. The onset in the chemistry file is bounded
#     from below by exactly this: wider tapers erase the signal at the instant a charger
#     reads it.
#
# ## The number this file exists to produce
#
# A -dV charger terminates on a fall of roughly 5 to 10 mV per cell, seen within a few
# minutes of the peak. (That window is the industry convention for the format, quoted
# across NiMH charging application notes; `DV_BAND_MV` in nimh_chemistry.rs is the same
# figure and that test asserts against it.) Measured here:
#
#   * t = 3186.5 s   the cell passes the 0.985 onset; `clamp` starts printing, at 0.014 A,
#                    and `heat` begins its climb from 0.04 W.
#   * t = 3300.0 s   the terminal PEAKS at 1.510460 V, 30.81 degC, with 2.635 A of the 3 A
#                    refused and `heat` at 3.70 W. The row prints 1.510 V.
#   * t = 3448.5 s   the cell is 10.00 K hotter and the terminal is 1.504527 V. That is
#                    5.933 mV below the peak, and the rows print 1.510 V and 1.505 V, so a
#                    reader subtracting what is on the screen gets 5 mV. Either way it is
#                    inside the window.
#
# The +10 K instant is the assertion and not an incidental one. The spike recorded scoring
# a pre-registered prediction green over a twenty-minute run where the honest figure at
# the instant a charger actually fires was under half of it. A charger sees about ten
# kelvin of rise before it decides, so that is where this file is read.
#
# ## What happens if nobody stops it
#
# Measured over 20 000 s: the voltage never rises again and the cell never cools, and the
# run settles at about 155 degC and 1.454 V, which is a cell that has vented and been
# thrown away. Nothing in this configuration will intervene -- there is no BMS here, and
# `nimh_subc_3ah_generic.toml` deliberately ships no [safety], because NiMH has no
# lithium-style self-sustaining decomposition exotherm to parameterise. The cell simply
# gets hotter until convection to a 25 degC ambient balances 4 W.
#
# ## Why the cell gets COLDER first
#
# On the way up the `heat` readout is NEGATIVE: -0.23 W on the first step, and the cell
# cools to 24.74 degC around t = 300 s before it starts warming again. That is the
# entropic term, -I*T*dU/dT, which with a negative dU/dT cools on charge; over most of
# this charge it is bigger than the ohmic heating it is fighting. Nickel cells really do
# this, and it is the observable this chemistry file's dU/dT was sized against. Pinned by
# `a_charging_cell_cools_before_it_warms` rather than left as an anecdote.
#
# ## What it does not do
#
#   * NO BMS. That is the point: something has to notice, and here nothing is watching.
#     The over-temperature protection an actual pack carries would open the contactor long
#     before 155 degC, and this file exists to show what it is protecting against.
#   * NO AGING, and it could not have any: `nimh_subc_3ah_generic.toml` ships no [aging]
#     section, so a pack configured with AgingConfig against it is a BUILD ERROR rather
#     than a silently ageless pack. That is the behaviour wanted -- no NiMH cycle-life fit
#     is in hand and inventing one would be worse than saying so.
#   * NO SCATTER, one cell, one group: nothing here is about imbalance.
#   * It does not reach v_max. The cell's protection ceiling is 1.60 V and the peak is
#     1.510 V, so OPERATING_POINT_OUT_OF_WINDOW never comes up. The only flag on this
#     whole trajectory is SOC_CLAMPED_HIGH, up from the onset onward.
#
# `nimh_overcharge_isothermal.toml` is this file with the thermal network taken out --
# the control arm, and the pairing `cold_charge_lto.toml` and `cold_charge_nmc.toml`
# already use.

chemistry = "nimh_subc_3ah_generic"

[meta]
name = "Overcharge, single NiMH cell"
description = """
A 1S1P 3 A·h sub-C nickel-metal-hydride cell at 10 % charge and 25 degC, thermally live, \
no BMS, no aging, no faults. Charge it at 1 C and keep charging: 53 minutes in the cell \
starts refusing a growing share of the current, and the charger's power turns into heat. \
The terminal voltage peaks at 1.510 V at 55 minutes and then FALLS -- 5.933 mV over the \
next 10 K of warming, which is the signal a NiMH fast charger terminates on. \
`nimh_overcharge_isothermal.toml` is the same file with the temperature pinned, where the \
terminal never turns over at all."""

[pack]
series = 1
parallel = 1
# A tenth full. Not a convenience: at 1 C a charge from here lasts 3240 s, which is eleven
# time constants of this cell's slow RC pair, so both RC pairs and the hysteresis state
# have settled long before the cell fills. `nimh_chemistry.rs` records what happens when
# they have not -- a charge started at 90 % measured 4.4 mV where the ohmic channel alone
# should have given 5.4, because the slow pair was still filling and LIFTING the voltage
# against the fall. It is also the realistic experiment: a charger starts from an empty
# pack.
initial_soc = 0.1
initial_temp_k = 298.15
# Unused here (no scatter, no aging, no plating -- this cell has no [safety] at all), but
# the seed is part of the snapshot and every scenario names it rather than inheriting a
# default.
seed = 0

# LOAD-BEARING, and the one line that separates this file from its twin. The whole -dV
# signal is temperature reaching the terminal, so a pack that cannot warm has no fall at
# all. k_neighbor is zero because there is one cell and no neighbour to conduct to; the
# cooling that matters is h_area_w_per_k to the ambient, which the chemistry file carries.
[pack.thermal.Network]
k_neighbor_w_per_k = 0.0

# Omitted below, and each omission means "off", not "on with defaults":
#   [pack.scatter]  -> every cell identical; one cell, so there is nothing to scatter
#   [pack.bms]      -> no BMS at all; nothing may refuse this charge or notice the heat
#   [pack.aging]    -> would be a build error against this chemistry (see above)
#   [[faults]]      -> nothing scheduled
