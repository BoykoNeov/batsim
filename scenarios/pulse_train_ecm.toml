# The control arm of the repo's first cell-model comparison.
#
# 1S1P LG M50, 90 % SOC, isothermal, nothing protecting it — and `cell_model` left at
# its default, so this is the equivalent circuit. `pulse_train_spm.toml` is this file
# with one field added. Nothing else differs, including the initial SOC, and that is
# load-bearing: the claims the guided path reads off these two files are read off the
# **first** pulse, and two arms starting at different SOC would be comparing the OCV
# curve instead of the two models.
#
# ## Why a pulse train, and why this one
#
# A scenario is an initial condition, not a demand program; the train lives in the
# client's `Pulse` demand mode (60 s on, 600 s off in the guided path). The long rest is
# the point. It separates the part of a cell's response that vanishes the instant the
# current stops from the part that has to diffuse away, and those two parts are where
# the two models disagree.
#
# Measured on this file at 1 C = 5.153 A, 25 degC, first pulse, on the circuit Phase 11
# fitted to the DFN (docs/plans/phase-11-fitting.md):
#
#   * the terminal drops 220.5 mV under load;
#   * 147.6 mV of that comes back instantly when the current goes off — that is `I*R0`;
#   * 67.6 mV climbs back over the following 600 s as the RC pairs discharge, and
#     97.2 % of it has arrived within 300 s — the slow pair's time constant is 330 s;
#   * and the last 5.4 mV does not come back at all: 60 s at 1 C is 1.67 % of the cell,
#     the open-circuit voltage stepping down, plus the slow pair's sliver still standing.
#
# Measure the tooth's *depth* rather than its rebound and it creeps: 220.5 / 221.4 /
# 222.8 / 226.4 / 228.4 mV across five pulses, as the fitted resistance and the OCV
# slope move with the charge taken out. The rebound has no OCV term in it, which is why
# it is the number the lesson uses.
#
# The rebound creeps too, and then stops: 67.6, 68.5, 68.6, 68.6, 68.6 mV. The slow pair
# carries a sliver of each pulse into the next, and what a linear time-invariant circuit
# carries over is a fixed fade, so identical pulses settle into identical teeth within
# a few of them. (On the placeholder pairs, 9 s and 72 s, the teeth were identical to
# four decimals from the first.) Ask it for 3 C instead and every part of the answer
# triples: 441.3 mV instantly, 202.8 mV slowly, x2.99 and x3.00 against the 1 C run.
# That is what "linear" means, and no choice of R0 and RC can escape it.
#
# See `pulse_train_spm.toml` for a model that answers x1.87 and x6.02 to the same
# question, and docs/plans/spm-scenario.md for the whole table.
#
# ## What is fitted here
#
# [r0] and [[rc]] both, to Chen2020's DFN at 1 C (tools/reference/fit_ecm.py; 4.85 mV RMS
# at 25 degC, 18.8 mV when the same circuit is scored at 3 C — a linear circuit cannot hold
# both rates). The magnitudes above are therefore the DFN's to a few millivolts, not the
# single-particle model's, which is why the guided path still leads with ratios when it
# compares the two. What no fit can move is that the circuit's ratios are 3.00.

chemistry = "nmc_21700_lgm50"

[meta]
name = "Pulse train, equivalent circuit"
description = """
A 1S1P LG M50 cell at 90 % SOC and 25 degC, isothermal, no BMS, no aging, no faults, \
running the equivalent-circuit model. Drive it with the client's pulse mode (60 s on, \
600 s off) and the rebound after each pulse creeps from 67.6 mV to 68.6 mV at 1 C and \
settles there, and is three times that at 3 C. Compare with \
`pulse_train_spm.toml`, which is this file with one field added."""

[pack]
series = 1
parallel = 1
# 90 %, not 100 %: at the clamp a pulse train's first rest has nowhere to put the
# charge it would recover, and 0.90 is a node of the [ocv] table rather than a point
# interpolated between two.
initial_soc = 0.90
initial_temp_k = 298.15
# Unused (no scatter, no aging, no plating), but the seed is part of the snapshot and
# every scenario names it rather than inheriting a default.
seed = 1

# Omitted below, and each omission means "off", not "on with defaults":
#   [pack.scatter]  -> every cell identical
#   [pack.thermal]  -> Isothermal: heat is reported, temperature never moves
#   [pack.bms]      -> no BMS at all; demands pass through unclamped
#   [pack.aging]    -> the pack never wears out
#   [[faults]]      -> nothing scheduled
#
# And one omission that is not "off" but "default": `cell_model`, which is Ecm. That
# omission is this file's entire identity.
