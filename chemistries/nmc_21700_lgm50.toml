# LG M50 21700 NMC811 / graphite cell — the first chemistry with a [spm] section.
#
# This file exists because `nmc_18650_generic.toml` could not honestly grow one. That
# file declares an 18650 / 3.0 A.h identity with hand-fit datasheet values, while the
# PyBaMM set it was once mapped to (Chen2020) parameterizes the LG M50: a 21700 / 5 A.h
# cell. For an ECM fit that mismatch is a capacity rescale one could argue about. For a
# single-particle model it is not arguable — particle radii, electrode thicknesses and
# interfacial areas ARE the cell's physical identity, and there is no honest way to put
# Chen2020's geometry in a file labelled 18650. So the debt is discharged by adding a
# truthful file rather than by renaming an untruthful one. See
# docs/plans/phase-6-porous-electrodes.md.
#
# ## The parts of this file have very different provenance, and it matters
#
# * The **[spm] and [dfn] sections are extracted**: every value is a key of the Chen2020
#   parameter set, a literal inside one of its functions, or a stated product of two
#   keys. Nothing in either is fitted, and `tools/reference/extract_spm.py` and
#   `extract_dfn.py` regenerate them.
# * The **ECM sections are mixed**: [ocv] and capacity_ah are fitted from the same
#   parameter set (tools/reference/fit_ocv.py), [thermal] is derived from its keys, and
#   [r0] / [[rc]] / [aging] / [safety] are labelled placeholders, exactly as in the
#   other shipped chemistries.
#
# Reading a terminal voltage out of the ECM half of this file is therefore reading a
# placeholder resistance; reading one out of the porous-electrode half is reading
# Chen2020. A cell may carry all three descriptions — running the same cell through
# three models and watching where the cheaper ones go wrong is the pedagogy Phases 6 and
# 7 exist for — but they are not equally trustworthy and this comment is where that is
# written down. Note [dfn] EXTENDS [spm] rather than replacing it: a DFN cell reads both.

[meta]
id         = "nmc_21700_lgm50"
name       = "LG M50 21700 (NMC811/graphite)"
provenance = "SPM parameters extracted verbatim from PyBaMM's Chen2020 parameter set (Chang-Hui Chen et al., 'Development of Experimental Techniques for Parameterization of Multi-scale Lithium-ion Battery Models', J. Electrochem. Soc. 167 (2020) 080534) by tools/reference/extract_spm.py; [dfn] extracted from the same set by tools/reference/extract_dfn.py, its two electrolyte transport fits being Nyman 2008 (A. Nyman, M. Behm, G. Lindbergh, 'Electrochemical characterisation and modelling of the mass transport phenomena in LiPF6-EC-EMC electrolyte', Electrochim. Acta 53 (2008) 6356) stored as published coefficients rather than sampled; [ocv] and capacity fitted from the same set by tools/reference/fit_ocv.py; [thermal] derived from its keys; [r0]/[[rc]]/[aging]/[safety] are labelled placeholders."

[cell]
# provenance: usable capacity between the Chen2020 stoichiometry limits, as reported by
# tools/reference/fit_ocv.py. Not the 5.0 A.h "Nominal cell capacity [A.h]" key: that is
# the label on the cell, while this is what the parameter set's own stoichiometry window
# actually holds. Using the fitted figure is what makes batsim's SOC track PyBaMM's.
capacity_ah     = 5.153198
v_max           = 4.20     # provenance: Chen2020 "Upper voltage cut-off [V]"
v_min           = 2.50     # provenance: Chen2020 "Lower voltage cut-off [V]"
max_charge_c    = 0.5      # provenance: placeholder for a 21700 energy cell (~0.3-0.7C standard charge); TODO cite a datasheet
max_discharge_c = 1.5      # provenance: placeholder continuous discharge rating for a 21700 energy cell; TODO cite a datasheet
t_charge_min_k  = 273.15   # provenance: charge inhibit below 0 degC (Li plating guard), same convention as the other shipped chemistries
t_max_k         = 333.15   # provenance: 60 degC operating ceiling, datasheet class placeholder

# --- fitted from PyBaMM Chen2020 (pybamm 26.6.2.0) by tools/reference/fit_ocv.py ---
# Thermodynamic cell OCV U_p(y(soc)) - U_n(x(soc)) over the usable stoichiometry window.
# Max piecewise-linear interpolation error of this table = 13.91 mV, which is large next
# to the LFP table's and is a known limitation rather than a mystery: fit_chemistry's SOC
# grid is hand-tuned for LFP's sharp knees and a flat plateau, so it samples the middle
# coarsely — exactly where NMC is steepest. The grid is deliberately NOT retuned here,
# because it is shared with the LFP chemistry whose committed goldens depend on it.
# TODO: give the grid a per-chemistry shape if this file ever carries ECM goldens.
[ocv]
soc   = [0.0000, 0.0025, 0.0050, 0.0075, 0.0100, 0.0125, 0.0150, 0.0175, 0.0200, 0.0300, 0.0400, 0.0500, 0.1000, 0.1500, 0.2500, 0.3500, 0.4500, 0.5500, 0.6500, 0.7500, 0.8500, 0.9000, 0.9500, 0.9600, 0.9700, 0.9800, 0.9825, 0.9850, 0.9875, 0.9900, 0.9925, 0.9950, 0.9975, 1.0000]
volts = [2.5000, 2.5598, 2.6146, 2.6651, 2.7114, 2.7540, 2.7932, 2.8293, 2.8625, 2.9712, 3.0504, 3.1094, 3.2959, 3.4339, 3.5286, 3.6290, 3.7054, 3.7983, 3.8896, 3.9943, 4.0809, 4.0967, 4.1236, 4.1351, 4.1488, 4.1645, 4.1687, 4.1729, 4.1773, 4.1817, 4.1862, 4.1907, 4.1954, 4.2000]

# Ohmic resistance R0[soc][temp_k], ohms. Bilinear interpolation, clamped.
# provenance: order-of-magnitude placeholder — a large-format 21700 runs a lower R0 than
# the 18650 set in the sibling file, rising at low temperature and near the SOC extremes
# (TODO: fit). Chen2020 supplies no ECM resistance; its own "Contact resistance [Ohm]" is
# 0 and appears in [spm] below, where it belongs.
[r0]
soc    = [0.0, 0.5, 1.0]
temp_k = [263.15, 298.15, 318.15]
ohms   = [[0.062, 0.028, 0.023],
          [0.055, 0.025, 0.020],
          [0.058, 0.026, 0.021]]

# Fast charge-transfer RC pair. tau = 0.010 * 900 = 9 s.
# provenance: order-of-magnitude placeholder (TODO: fit from GITT/pulse data).
[[rc]]
r_ohms  = 0.010
c_farad = 900.0

# Slow diffusion RC pair. tau = 0.008 * 9000 = 72 s.
# provenance: order-of-magnitude placeholder (TODO: fit from GITT/pulse data).
[[rc]]
r_ohms  = 0.008
c_farad = 9000.0

# Both values DERIVED from Chen2020 keys rather than guessed — see the arithmetic below.
# How the cell behaves below empty. Driven past soc = 0 a real cell does not stop
# delivering current -- it goes into voltage reversal, its OCV falls through zero, and the
# external circuit starts paying. Without this the engine would keep sourcing at OCV(0)
# forever and fabricate energy; see docs/plans/low-clamp-reversal.md.
[reversal]
# provenance: placeholder -- order-of-magnitude only, TODO fit. Sized so the cell collapses
# from its empty-endpoint OCV (2.5 V) to the floor over 2 % of capacity.
v_per_soc = 125.0
# provenance: placeholder -- a declared limit rather than a measured plateau. A real
# reversed cell continues to roughly -1 to -2 V on copper dissolution before failing; 0 V
# is the conservative choice and bounds an otherwise unbounded ramp.
floor_v   = 0.0
# What over-discharge costs: capacity fraction lost per Ah delivered past empty. Past
# empty the anode has no lithium left to give and its copper current collector oxidises
# instead, which does not come back.
# provenance: placeholder -- order-of-magnitude only, TODO fit. Sized against the collapse
# window above, the same way v_per_soc is sized against OCV(0): one FULL reversal (2 % of
# capacity past empty, 0.1031 Ah here) costs ~1.0 % of capacity. Held at ~5700x
# cyc_fade_per_ah and ~110x plating_fade_per_ah, as in the 18650 set. Note this coefficient
# is consumed only by the ECM path -- the Spm and Dfn models this file also parameterises
# never clamp, so they carry no deficit and pay nothing here (see CellModel::soc_deficit).
fade_per_ah = 1.0e-1

[thermal]
# provenance: sum over Chen2020's five sandwich domains of (electrode area x thickness x
# density x specific heat capacity), with area = 0.065 m x 1.58 m = 0.1027 m2:
#   neg. current collector 4.251 + neg. electrode 10.149 + separator 0.342
#   + pos. electrode 17.729 + pos. current collector 3.980  =  36.451 J/K
# This is a LOWER BOUND on the real cell, and knowingly so: the sum masses 55.8 g of
# jelly roll while an LG M50 weighs closer to 68-70 g, because Chen2020 gives no mass for
# the electrolyte, the can or the header. A cell with too little heat capacity heats too
# fast, so this errs toward alarming rather than reassuring — the safe direction for a
# teaching model, but still an error. TODO: add the missing masses from a datasheet.
heat_capacity_j_per_k = 36.451
# provenance: Chen2020 "Total heat transfer coefficient [W.m-2.K-1]" (10.0) x "Cell
# cooling surface area [m2]" (0.00531) = 0.0531 W/K. The area is the bare cylinder's
# (pi*d*h + 2*pi*r^2 for a 21 x 70 mm can), so this is already the fully-exposed value
# the engine expects and scales down per cell by neighbour occlusion.
h_area_w_per_k        = 0.0531

# No docv_dt_v_per_k column: Chen2020's entropic-change keys are both literally 0.0 (see
# docp_dt_v_per_k in [spm] below), so this chemistry generates no reversible heat in
# either model. That is the parameter set's own value, not a missing measurement.

# Semi-empirical aging. All placeholders, scaled from nmc_18650_generic.toml — the same
# NMC class, a different format — with the one rescale that capacity forces.
[aging]
# provenance: placeholder, carried over unchanged from the 18650 NMC set. Calendar fade
# is a capacity *fraction* per sqrt(second), so it does not scale with cell size; the pair
# below gives roughly 16 % in a year at 25 degC and full SOC. cal_pre_exp and
# cal_ea_j_per_mol only mean anything TOGETHER. TODO fit.
cal_pre_exp                = 1.2e3
cal_ea_j_per_mol           = 4.5e4    # provenance: placeholder Arrhenius activation energy, TODO fit
cal_soc_stress             = [1.0, 1.1, 1.8]  # provenance: placeholder SOC stress at soc = 0.0/0.5/1.0 (NMC worse at high SOC)
# provenance: placeholder, RESCALED from the 18650 file's 3.0e-5 by the capacity ratio
# 3.0 / 5.153198 = 0.582. Cycle fade is charged per amp-hour of throughput, so leaving the
# per-Ah figure alone would age this cell 1.7x faster per full cycle purely for being
# bigger. The per-cycle fade is what is held constant here. TODO fit.
cyc_fade_per_ah            = 1.75e-5
cyc_dod_stress_exp         = 1.2      # provenance: placeholder DOD stress exponent (per-cycle convention)
r_growth_per_capacity_loss = 1.5      # provenance: placeholder — resistance grows faster than capacity fades

# Emergent-failure thresholds. Placeholders, but placeholders whose SCALE is checked,
# because these numbers are only meaningful in pairs (the trap the sibling NMC file
# documents at length).
#
#   - adiabatic ceiling = 29.8 kJ / 36.451 J/K = 818 K rise, so a fully-reacted cell
#     peaks near 1261 K (988 degC), the ~1000 degC ARC tests report for NMC cells. Note
#     this budget is SMALLER than the 18650 file's 45 kJ despite the cell being larger:
#     both scale with the [thermal] heat capacity above, which is a lower bound. The pair
#     is what is calibrated, not either number alone.
#   - onset -> vent = 30 K x 36.451 J/K = 1.09 kJ, released at 8 W rising to ~45 W across
#     that span, so an adiabatic cell at onset vents in roughly a minute.
#
# Plating placeholders are scaled from the 18650 NMC file the same way [aging] was, so
# one full cold charge above the threshold costs a comparable fraction of capacity and
# carries a comparable (~0.6 %) chance of leaving a soft short at this cell's 5.15 A.h.
[safety]
t_onset_k           = 443.15   # provenance: ~170 degC exothermic onset (NMC class); placeholder
t_vent_k            = 473.15   # provenance: ~200 degC vent placeholder
runaway_energy_j    = 29.8e3   # provenance: placeholder set for an 818 K adiabatic rise on this cell's derived heat capacity; TODO fit
runaway_power_w_at_onset = 8.0 # provenance: placeholder amplitude, as the 18650 set; with the Ea below gives a ~1 min adiabatic onset-to-vent; TODO fit
runaway_ea_j_per_mol     = 1.0e5 # provenance: placeholder activation energy for the decomposition exotherm, order-of-magnitude typical for Li-ion ARC fits; TODO fit
t_plating_min_k     = 273.15   # provenance: plating risk below 0 degC
plating_c_threshold = 0.4      # provenance: placeholder C-rate above which cold-charge plating risk flags
plating_fade_per_ah        = 8.75e-4 # provenance: placeholder, held at ~50x cyc_fade_per_ah as in the 18650 set, TODO fit
plating_short_hazard_per_ah = 1.2e-3 # provenance: placeholder Poisson hazard per Ah plated, rescaled by capacity to keep ~0.6 % per full cold charge, TODO fit
plating_short_ohms         = 25.0    # provenance: placeholder soft short, ~1000x this cell's R0; TODO fit

# --- extracted from PyBaMM Chen2020 (pybamm 26.6.2.0) by tools/reference/extract_spm.py ---
# Every value below is a key of the Chen2020 parameter set, a literal inside one of its
# functions, or a stated product of two keys. Nothing here is fitted or invented.
#
# ## One field is deliberately absent, in both electrodes: diffusivity_ea_j_per_mol
#
# Chen2020 fits solid-phase diffusivity as a CONSTANT at 298.15 K and publishes no
# activation energy for it, while it does publish one for the kinetics (E_r, inside the
# exchange-current-density functions, extracted below). So this cell's kinetics respond to
# temperature and its solid diffusion does not. That is a real limitation of the parameter
# set, and it is left visible rather than papered over with a plausible number, which is
# what the provenance rule forbids. The schema field exists and defaults to zero
# (= temperature-independent); a parameter set that publishes one will fill it.
# TODO: source an activation energy for D_s from a set that measures it.
[spm]
t_ref_k                = 298.15   # Chen2020 "Reference temperature [K]"
c_e_mol_per_m3         = 1000     # Chen2020 "Initial concentration in electrolyte [mol.m-3]"; constant, per the single-particle approximation
electrode_area_m2      = 0.1027   # = "Electrode height [m]" 0.065 x "Electrode width [m]" 1.58
contact_resistance_ohm = 0        # Chen2020 "Contact resistance [Ohm]" — the set's own value, not an omission

[spm.negative]
particle_radius_m       = 5.86e-06   # Chen2020 "Negative particle radius [m]"
diffusivity_m2_per_s    = 3.3e-14    # Chen2020 "Negative particle diffusivity [m2.s-1]", constant at t_ref_k
c_max_mol_per_m3        = 33133      # Chen2020 "Maximum concentration in negative electrode [mol.m-3]"
active_volume_fraction  = 0.75       # Chen2020 "Negative electrode active material volume fraction"
thickness_m             = 8.52e-05   # Chen2020 "Negative electrode thickness [m]"
m_ref                   = 6.48e-07   # literal inside graphite_LGM50_electrolyte_exchange_current_density_Chen2020
reaction_ea_j_per_mol   = 35000      # E_r, literal inside the same function
charge_transfer_alpha   = 0.5        # Chen2020 "Negative electrode charge transfer coefficient"
stoich_min              = 0.02634579027064577  # pybamm.lithium_ion.get_min_max_stoichiometries
stoich_max              = 0.910618046652409    # ditto
docp_dt_v_per_k         = 0          # Chen2020 "Negative electrode OCP entropic change [V.K-1]" — literally zero
# OCP table over the FULL stoichiometry range [0, 1]: 45 adaptively-placed core points
# over [0.0000, 0.9606] (margin 0.05 either side of the usable window), plus 2 appended
# above. Max piecewise-linear interpolation error = 1.90 mV in the core, 0.00 mV in the
# extension — graphite's fit is exactly constant at 0.092020 V above 0.96, which is why
# two points describe that whole tail.
# Monotone NON-INCREASING: lithiating an electrode lowers its potential against Li metal.
#
# The core's 45 breakpoints are UNCHANGED from Phase 6 and that is load-bearing rather
# than incidental: `extract_spm.py` refines its grid greedily against a dense reference
# over the interval it is given, so regenerating over [0, 1] in one pass would move every
# one of them and shift the interpolation inside the window the shipped SPM goldens and
# `spm_exact_bits.rs` are pinned to. The extension is therefore append-only by
# construction — the core is generated over the margin window alone, and the tails are
# tabulated separately and concatenated. See the extension note above [spm.positive.ocp],
# which is the electrode this was actually measured on.
[spm.negative.ocp]
stoich = [0.000000, 0.001921, 0.003842, 0.005764, 0.008165, 0.010086, 0.012488, 0.014409, 0.016811, 0.019212, 0.021614, 0.024015, 0.026897, 0.029779, 0.032661, 0.035543, 0.038905, 0.041787, 0.044669, 0.048031, 0.051393, 0.054755, 0.058598, 0.066283, 0.073968, 0.082613, 0.120077, 0.131605, 0.141211, 0.150817, 0.160904, 0.182037, 0.240155, 0.313161, 0.360232, 0.405381, 0.480309, 0.562442, 0.582615, 0.600386, 0.627284, 0.646976, 0.720464, 0.840541, 0.960618, 0.980309, 1.000000]
volts  = [2.383542, 2.239361, 2.105678, 1.981729, 1.839406, 1.734843, 1.614777, 1.526564, 1.425269, 1.333101, 1.249234, 1.172918, 1.090348, 1.016606, 0.950740, 0.891900, 0.831122, 0.785002, 0.743763, 0.701109, 0.663619, 0.630624, 0.597669, 0.544080, 0.502793, 0.466069, 0.339172, 0.301626, 0.275332, 0.255382, 0.240870, 0.224442, 0.200475, 0.155705, 0.139904, 0.134918, 0.133212, 0.130928, 0.126620, 0.118532, 0.102776, 0.095991, 0.092070, 0.092020, 0.092020, 0.092020, 0.092020]

[spm.positive]
particle_radius_m       = 5.22e-06   # Chen2020 "Positive particle radius [m]"
diffusivity_m2_per_s    = 4e-15      # Chen2020 "Positive particle diffusivity [m2.s-1]", constant at t_ref_k
c_max_mol_per_m3        = 63104      # Chen2020 "Maximum concentration in positive electrode [mol.m-3]"
active_volume_fraction  = 0.665      # Chen2020 "Positive electrode active material volume fraction"
thickness_m             = 7.56e-05   # Chen2020 "Positive electrode thickness [m]"
m_ref                   = 3.42e-06   # literal inside nmc_LGM50_electrolyte_exchange_current_density_Chen2020
reaction_ea_j_per_mol   = 17800      # E_r, literal inside the same function
charge_transfer_alpha   = 0.5        # Chen2020 "Positive electrode charge transfer coefficient"
stoich_min              = 0.2638452245913301   # pybamm.lithium_ion.get_min_max_stoichiometries
stoich_max              = 0.853974674630047    # ditto
docp_dt_v_per_k         = 0          # Chen2020 "Positive electrode OCP entropic change [V.K-1]" — literally zero
# OCP table over the FULL stoichiometry range [0, 1]: 20 adaptively-placed core points
# over [0.2138, 0.9040] (same margin rule as above), plus 5 appended below and 2 above.
# Max piecewise-linear interpolation error = 1.88 mV in the core, 1.37 mV in the
# extension. Monotone NON-INCREASING, for the same reason as the negative — note the cell
# voltage still RISES with state of charge, because charging drives x up and y down at
# once.
#
# ## Why this table now runs to 1.0, and why a 0.05 margin looked sufficient for six
#
# This is the electrode the extension was MEASURED on. Phase 7's spike found that a DFN
# drives this particle's LOCAL surface stoichiometry — the value at the separator-facing
# edge, which only a model that resolves the electrode thickness has — to 0.9998 at 3C,
# spending 27.6 % of the run above the 0.9040 this table used to stop at. Above it
# `ocp_lookup` clamps flat, precisely where the real OCP plunges, so the modelled cell
# kept delivering voltage: 876 s to cut-off against PyBaMM's 488 s at the same amps.
#
# The x-AVERAGED surface stoichiometry peaks at only 0.7065 even at 3C. An SPM has only
# the x-averaged quantity, so no SPM run at any rate this simulator supports can reach
# the old table top. The margin was not too small for the model it was sized for — it was
# unreachably generous there, and this failure mode was not merely undetected in Phase 6
# but impossible to reach. Extending both electrodes to the full range removes the
# question rather than re-sizing a margin for a second model and inheriting it to a third.
[spm.positive.ocp]
stoich = [0.000000, 0.106923, 0.142421, 0.170007, 0.193209, 0.213845, 0.235239, 0.277682, 0.289069, 0.300111, 0.312879, 0.339104, 0.351871, 0.367054, 0.386378, 0.428821, 0.472644, 0.517157, 0.558910, 0.580304, 0.599283, 0.645176, 0.731442, 0.817708, 0.903975, 0.951987, 1.000000]
volts  = [4.678510, 4.588174, 4.552776, 4.518795, 4.481868, 4.439085, 4.382325, 4.250906, 4.223702, 4.205249, 4.193330, 4.182349, 4.173384, 4.156102, 4.126908, 4.060738, 4.005020, 3.949186, 3.884181, 3.850953, 3.825361, 3.777287, 3.704691, 3.634779, 3.564985, 3.526142, 3.487300]

# --- extracted from PyBaMM Chen2020 (pybamm 26.6.2.0) by tools/reference/extract_dfn.py ---
# Every value below is a key of the parameter set or a coefficient of one of its published
# closed-form electrolyte fits, read out of the function source and cross-checked against
# PyBaMM's own evaluation at 7 concentrations. Nothing here is fitted, sampled or invented.
#
# ## This section EXTENDS [spm]; it does not stand alone
#
# Every electrode geometry, kinetic coefficient and OCP table a Doyle-Fuller-Newman cell
# needs is already in [spm] above, and a DFN cell reads both sections. What is here is
# only what a DFN adds: the electrolyte's transport properties as functions of
# concentration, the porous geometry it occupies, and the solid-phase conductivities that
# let the reaction current vary through the electrode thickness. In particular the
# electrode thicknesses are [spm.negative]/[spm.positive].thickness_m and are not
# repeated, while the SEPARATOR thickness is here, because a single-particle model has no
# separator at all.
#
# ## Why the transport properties are coefficients rather than a table
#
# PyBaMM publishes D_e and kappa_e as callables, which is the shape that made
# extract_spm.py parse function bodies. Underneath they are published closed-form fits
# (Nyman 2008, LiPF6 in EC:EMC 3:7) with NO temperature dependence, so they are stored
# exactly, as sums of coefficient * (c_e/1000)^exponent in the fit's own variable. That
# is not tidiness: Phase 6 found the OCP tables' 1.88/1.90 mV interpolation error WAS the
# SPM's accuracy floor, and sampling these onto a second grid would have raised it for
# nothing. The exponent 1.5 in the conductivity is why this is a list of (coefficient,
# exponent) pairs and not a coefficient array -- the fit is a sum of power terms, not a
# polynomial.
#
# ## What this section deliberately does NOT carry
#
# No numerical guard on the concentration. kappa_e -> 0 as c_e -> 0 degenerates the
# electrolyte potential equation and the reference genuinely goes there (at 3C, 90.6 % of
# the run has c_e < 100 mol/m3 somewhere), but whatever floor a solver applies to its
# LOOKUPS is a property of the solver, not of the electrolyte. The distinction is
# load-bearing and measured: a floor of 100 mol/m3 buys four Newton iterations and pays
# 0.72 A.h for them, monotonically and without raising any flag. A chemistry file that
# carried that number would be hiding a solver decision inside a parameter set.
[dfn]
transference_number  = 0.2594   # "Cation transference number"
thermodynamic_factor = 1.0   # "Thermodynamic factor" - literally 1.0, so the (1 + dlnf/dlnc) term is unity
# D_e(c_e) [m2/s] and kappa_e(c_e) [S/m] as sums of coefficient * (c_e/1000)^exponent.
# Nyman 2008, LiPF6 in EC:EMC 3:7; no temperature dependence, per the fit's own comment.
# Both are NON-MONOTONE over the range a 3C discharge visits: D_e falls 10.8x from 200 to
# 2200 mol/m3 and then rises, kappa_e peaks near 1000 and falls 2.3x by 2600.
electrolyte_diffusivity_terms  = [{ coefficient = 8.794e-11, exponent = 2 }, { coefficient = -3.972e-10, exponent = 1 }, { coefficient = 4.862e-10, exponent = 0 }]
electrolyte_conductivity_terms = [{ coefficient = 0.1297, exponent = 3 }, { coefficient = -2.51, exponent = 1.5 }, { coefficient = 3.329, exponent = 1 }]

# Note porosity (eps_e) is a DIFFERENT number from [spm.*].active_volume_fraction (eps_s),
# and the two do not sum to one: binder, conductive additive and carbon make up the rest.
# Negative here is 0.75 solid against 0.25 pore; positive 0.665 against 0.335.
[dfn.negative]
porosity                   = 0.25   # "Negative electrode porosity" (eps_e, NOT the [spm] active_volume_fraction)
bruggeman_electrolyte      = 1.5
bruggeman_electrode        = 0   # the set's own value, not an omission
# 215 S/m is a LOT of conductivity, and the spike measured what it buys: this electrode's
# solid phase is equipotential to within 36 microvolts even at 3C.
solid_conductivity_s_per_m = 215.0

[dfn.positive]
porosity                   = 0.335   # "Positive electrode porosity" (eps_e, NOT the [spm] active_volume_fraction)
bruggeman_electrolyte      = 1.5
bruggeman_electrode        = 0   # the set's own value, not an omission
# Four orders of magnitude below the negative's, and this is the one that costs volts:
# 2 mV at C/5, 42 mV at 3C. Still small next to the electrolyte's 668 mV at 3C, which is
# why shipping "an SPM plus an electrolyte" would be nearly indistinguishable ON THIS SET
# and is refused anyway -- a set with a worse positive conductivity would expose it.
solid_conductivity_s_per_m = 0.18

[dfn.separator]
thickness_m           = 1.2e-05   # "Separator thickness [m]"
porosity              = 0.47   # "Separator porosity"
bruggeman_electrolyte = 1.5

# For reference, the initial electrolyte concentration is 1000 mol/m3 and is NOT
# repeated here: it is [spm].c_e_mol_per_m3, which an SPM holds CONSTANT and a DFN takes
# as the initial value of a field it then solves for. Same key, same number, two readings.
