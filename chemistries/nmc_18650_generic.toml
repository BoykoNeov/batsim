# Generic NMC 18650 cell parameters.
#
# The loader consumes [meta], [cell], [ocv], [r0], [[rc]], [thermal], [aging], and
# [safety]. Within [safety] the plating fields are live; the runaway trio is validated
# but not yet consumed. Every physical constant carries a provenance note per the
# project rule: no unlabeled numbers.
#
# This cell uses two RC pairs (a fast charge-transfer pair and a slow diffusion
# pair), exercising the 2-RC model path.

[meta]
id         = "nmc_18650_generic"
name       = "Generic NMC 18650"
provenance = "OCV/R0 shape hand-fit to typical NMC 18650 datasheets; RC and remaining values are order-of-magnitude placeholders (TODO: fit against PyBaMM Chen2020/OKane2022)."

[cell]
capacity_ah     = 3.0      # provenance: nominal for a high-capacity NMC 18650 (datasheet class)
v_max           = 4.20     # provenance: standard NMC charge cutoff
v_min           = 3.00     # provenance: conservative NMC discharge cutoff (datasheet class)
max_charge_c    = 0.7      # provenance: typical NMC continuous charge rating (~0.5-1C)
max_discharge_c = 2.0      # provenance: typical NMC continuous discharge rating for a capacity cell
t_charge_min_k  = 273.15   # provenance: charge inhibit below 0 degC (Li plating guard)
t_max_k         = 333.15   # provenance: 60 degC operating ceiling (datasheet class)

# Monotone OCV(soc); linear interpolation, clamped at the ends.
# provenance: representative sloped NMC open-circuit curve (no flat plateau,
# unlike LFP) hand-fit to datasheet discharge curves.
[ocv]
soc   = [0.00, 0.05, 0.10, 0.20, 0.40, 0.60, 0.80, 0.90, 0.95, 1.00]
volts = [3.00, 3.40, 3.55, 3.63, 3.75, 3.87, 4.02, 4.11, 4.15, 4.20]

# Ohmic resistance R0[soc][temp_k], ohms. Bilinear interpolation, clamped.
# provenance: order-of-magnitude placeholder — a few tens of milliohms, rising at
# low temperature and near the SOC extremes (TODO: fit). NMC R0 runs a little
# lower than the LFP set.
[r0]
soc    = [0.0, 0.5, 1.0]
temp_k = [263.15, 298.15, 318.15]
ohms   = [[0.045, 0.018, 0.015],
          [0.040, 0.016, 0.013],
          [0.042, 0.017, 0.014]]

# Fast charge-transfer RC pair. tau = 0.008 * 800 = 6.4 s.
# provenance: order-of-magnitude placeholder (TODO: fit from GITT/pulse data).
[[rc]]
r_ohms  = 0.008
c_farad = 800.0

# Slow diffusion RC pair. tau = 0.006 * 8000 = 48 s.
# provenance: order-of-magnitude placeholder (TODO: fit from GITT/pulse data).
[[rc]]
r_ohms  = 0.006
c_farad = 8000.0

[thermal]
heat_capacity_j_per_k = 55.0   # provenance: ~m*cp for an 18650 (~45 g, mixed materials); placeholder
# h*A for a FULLY EXPOSED cell (as on a 1S1P pack); the engine scales it down per
# cell by the surface fraction not blocked by neighbours.
h_area_w_per_k        = 0.20   # provenance: natural-convection h*A placeholder for a bare cell

# No docv_dt_v_per_k column, so entropic heating is disabled for this chemistry
# (TODO: add measured dU/dT to enable the reversible heat term).

# Semi-empirical aging. Calendar fade is k(T, soc)*sqrt(t) with t in SECONDS and the
# result a capacity *fraction*; cycle fade is per Ah of throughput, weighted by the
# depth of the excursion carrying it. All placeholders, but placeholders that have to
# be plausible TOGETHER: cal_pre_exp and cal_ea_j_per_mol only mean anything as a
# pair, since the pre-exponential is the Arrhenius factor's scale at the chosen
# activation energy.
[aging]
# provenance: placeholder, TODO fit. Rescaled from 2.0e4 when Phase 3 wired [aging]
# into the engine: paired with the Ea below, that value produced ~260 % calendar fade
# in a year at 25 degC, i.e. a pack dead within weeks. Set so the pair gives roughly
# 16 % in a year at 25 degC and full SOC — a little worse than the LFP set, which is
# the right ordering for NMC.
cal_pre_exp                = 1.2e3
cal_ea_j_per_mol           = 4.5e4    # provenance: placeholder Arrhenius activation energy, TODO fit
cal_soc_stress             = [1.0, 1.1, 1.8]  # provenance: placeholder SOC stress at soc = 0.0/0.5/1.0 (NMC worse at high SOC)
cyc_fade_per_ah            = 3.0e-5   # provenance: placeholder cycle fade per Ah throughput, TODO fit
cyc_dod_stress_exp         = 1.2      # provenance: placeholder DOD stress exponent (per-cycle convention)
r_growth_per_capacity_loss = 1.5     # provenance: placeholder — resistance grows faster than capacity fades

# Emergent-failure thresholds. Both halves are live.
#
# Runaway: worse than the LFP set on every axis, which is the right ordering — NMC is
# the chemistry whose failures make the news. Scale check on the placeholders, which
# only mean anything TOGETHER (the failure mode the [aging] pair demonstrated in
# slice A):
#   - adiabatic ceiling  = 45 kJ / 55 J/K = 818 K, so a fully-reacted cell peaks near
#     1261 K (988 degC), the ~1000 degC ARC tests report for NMC 18650s.
#   - onset -> vent      = 30 K x 55 J/K = 1.65 kJ, released at 8 W rising to ~45 W
#     across that span, so an adiabatic cell at onset vents in about 1.5 minutes —
#     roughly twice as fast as the LFP set, from a lower absolute margin.
# Both are shape checks, not fits; sim-data pins them against a band.
#
# Plating: the placeholders below are set worse than the LFP set across the board,
# which is the right ordering — NMC/graphite cells are the ones fast-charged hard
# enough for cold-charge plating to be the classic field failure, and they carry a
# higher plating_c_threshold penalty because they are charged at higher rates to begin
# with. Scale check at this cell's 3.0 Ah: one full cold charge above the threshold
# costs ~0.45 % capacity and carries a ~0.6 % chance of leaving a soft short.
[safety]
t_onset_k           = 443.15   # provenance: ~170 degC exothermic onset (NMC less stable than LFP); placeholder
t_vent_k            = 473.15   # provenance: ~200 degC vent placeholder
runaway_energy_j    = 45.0e3   # provenance: placeholder per-cell exothermic budget, set for an 818 K adiabatic rise (~1000 degC peak, as ARC tests report); was 90.0e3, which gave a 1636 K rise — hotter than the cell's own materials survive; TODO fit
runaway_power_w_at_onset = 8.0     # provenance: placeholder amplitude, ~1.6x LFP; chosen with the Ea below for a ~1.5 min adiabatic onset-to-vent; TODO fit
runaway_ea_j_per_mol     = 1.0e5   # provenance: placeholder activation energy for the decomposition exotherm, order-of-magnitude typical for Li-ion ARC fits; TODO fit
t_plating_min_k     = 273.15   # provenance: plating risk below 0 degC
plating_c_threshold = 0.4      # provenance: placeholder C-rate above which cold-charge plating risk flags
plating_fade_per_ah        = 1.5e-3  # provenance: placeholder — set ~50x cyc_fade_per_ah and above the LFP figure, TODO fit
plating_short_hazard_per_ah = 2.0e-3 # provenance: placeholder Poisson hazard per Ah plated, ~2x LFP, TODO fit
plating_short_ohms         = 30.0    # provenance: placeholder soft short, ~5000x this cell's R0; TODO fit
