volts  = [3.907700, 3.854249, 3.806508, 3.763868, 3.708296, 3.676148, 3.634249, 3.578419, 3.551751, 3.529237, 3.494186, 3.465799, 3.442452, 3.429621, 3.420645, 3.410104, 3.405791, 3.403882, 3.401973, 3.400064, 3.398154, 3.396244, 3.394304, 3.391874, 3.384935, 3.377983, 3.367622, 3.355770, 3.340548, 3.321542, 3.298061, 3.269708, 3.236062, 3.196599, 3.150560, 3.096802, 3.036204, 2.967752, 2.889731, 2.803788, 2.708101, 2.602598, 2.487431]

# The positive electrode's regular-solution potential, read only by the many-particle cell
# (SpmEnsemble); the table above stays the set's own potential, for every other reader.
# u0_v: Bai, Cogswell & Bazant 2011 (Nano Lett. 11, 4890), LFP regular-solution U0. Cited, not fitted.
# omega_ev: FITTED by tools/reference/extract_spm.py so the curve's turning points sit
# 20 mV apart at 298.15 K -- Dreyer et al. 2010 (Nat. Mater. 9, 448), LFP rest-voltage gap ~20 mV.
[spm.positive.regular_solution]
