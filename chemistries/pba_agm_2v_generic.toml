# Generic AGM lead-acid cell parameters (one 2 V cell; a 12 V battery is 6S).
#
# The loader consumes [meta], [cell], [ocv], [r0], [[rc]], [reversal], [diffusion],
# [thermal] and [aging]. [safety] is deliberately ABSENT -- see the note at the bottom of
# this file. Every physical constant carries a provenance note per the project rule: no
# unlabeled numbers. There is no PyBaMM parameter set behind lead-acid, so almost
# everything here is anchored on datasheet-class hardware figures rather than fitted, and
# says so.
#
# THIS IS THE ONLY SHIPPED CHEMISTRY WITH A [diffusion] SECTION, and it is the reason the
# file is worth reading twice. docs/plans/lead-acid-data-only.md measured this cell
# reproducing only about half of the capacity a real lead-acid battery loses between a
# trickle and a hard discharge, and NONE of it below 1C -- a property of the model rather
# than of these numbers, which no choice of [r0] could fix. The section near the bottom of
# this file is what fixed it, and the fix was a code change: one extra state per cell. See
# docs/plans/diffusion-overpotential.md. Worst error against Peukert n=1.1 across
# 0.05C -> 3C went from 25.9 points to 3.3.

[meta]
id         = "pba_agm_2v_generic"
name       = "Generic AGM lead-acid 2 V cell"
provenance = "Assembled from datasheet-class figures for a 12 V 7.2 Ah AGM (UPS class), divided down to one cell: OCV from electrolyte specific gravity, R0 from quoted battery internal resistance cross-checked against cranking voltage. Nothing here is fitted to a reference model; see docs/plans/lead-acid-data-only.md."

[cell]
# provenance: nominal C20 rating of a 12 V 7.2 Ah AGM (UPS class). Lead-acid capacity is
# quoted at the 20-hour rate BY CONVENTION, precisely because the delivered capacity falls
# with rate -- so this number means "7.2 Ah if you take 20 hours over it", and the engine
# reproduces only part of the fall-off. See the plan doc.
capacity_ah     = 7.2
v_max           = 2.45     # provenance: standard AGM absorption/charge cutoff per cell (float is 2.25 V)
v_min           = 1.75     # provenance: standard end-of-discharge per cell AT THE 20-HOUR RATE. Real datasheets LOWER this to ~1.60 V at high rate; the engine has one fixed cutoff, which is itself part of the gap measured in the plan doc.
max_charge_c    = 0.3      # provenance: lead-acid charge acceptance is ~0.1-0.3C, an order of magnitude below lithium's -- one of the sharpest practical contrasts in this file
max_discharge_c = 3.0      # provenance: typical AGM continuous discharge rating (starting batteries burst far higher for seconds)
# provenance: lead-acid has NO lithium-plating mechanism, so the low-temperature charge
# inhibit that guards a Li cell does not apply. The real cold limit is electrolyte
# FREEZING, which depends on state of charge (a full cell freezes near -60 degC, a flat
# one near -8 degC because it is mostly water). The engine has no SOC-dependent freeze
# model, so this is set to the flat-cell figure as the conservative single number.
t_charge_min_k  = 265.15   # -8 degC
t_max_k         = 323.15   # provenance: 50 degC operating ceiling; AGM life roughly halves per 10 K above 25 degC

# Monotone OCV(soc); linear interpolation, clamped at the ends.
# provenance: rest voltage from electrolyte specific gravity, the standard lead-acid
# relation OCV ~ SG + 0.84, with SG running 1.265 full to ~1.12 discharged. Values are
# the conventional table (2.12-2.13 V full, ~1.95 V empty) rather than a fit.
#
# The shape is the pedagogical point and it is NOT "steeper than LFP" -- lead-acid spans
# 180 mV end to end where LFP spans 1600 mV, so LFP moves 8.9x MORE voltage overall. What
# lead-acid has is UNIFORMITY, measured decile by decile: this cell's slope varies 1.7x
# between its flattest and steepest tenth (0.128 to 0.220 V per unit soc -- it is concave,
# steeper when empty, because the electrolyte is a reactant), where LFP's varies 248x. And
# lead-acid's FLATTEST decile is still 3.2x more informative than LFP's flattest. That is
# why a lead-acid state of charge can be read off a resting voltmeter and an LFP one cannot.
#
# Those figures are the ones crates/sim-data/tests/lead_acid_rate.rs asserts. An earlier
# version of this comment said "1.76-1.80 mV per 1 %, flat to within 2 %", "40x" and
# "4.5x"; all three were artifacts of averaging over windows that straddled LFP table
# breakpoints, and are recorded as a miss in docs/plans/lead-acid-data-only.md.
[ocv]
soc   = [0.00, 0.25, 0.50, 0.75, 1.00]
volts = [1.950, 2.005, 2.055, 2.098, 2.130]

# Ohmic resistance R0[soc][temp_k], ohms per CELL. Bilinear interpolation, clamped.
#
# provenance: mid-SOC room-temperature value is the quoted ~23 mOhm internal resistance of
# a 12 V 7.2 Ah AGM divided by its 6 cells = 3.83 mOhm. Cross-checked independently on
# different hardware: a 60 Ah starting battery at 0.83 mOhm/cell cranking at 400 A gives
# 10.7 V at the terminals, and real cranking voltage is 9.5-10.5 V.
#
# The rise toward empty is placeholder SHAPE, not a fit (TODO: fit from discharge curves).
# It USED to be the only mechanism this model had for rate-dependent capacity loss, and the
# plan doc shows it is structurally the wrong shape for the job -- so do not tune it to
# match a Peukert curve. Fitting one rate with it is easy and meaningless; that job now
# belongs to [diffusion], and this table should be fitted to what it actually is, which is
# the instantaneous ohmic drop.
# Low-temperature column: lead-acid resistance roughly doubles at -20 degC (acid viscosity
# and reduced ion mobility); placeholder factor, order-of-magnitude only.
[r0]
soc    = [0.00, 0.10, 0.20, 0.50, 1.00]
temp_k = [253.15, 298.15, 323.15]
ohms   = [[0.0306, 0.0153, 0.0138],
          [0.0184, 0.0092, 0.0083],
          [0.0108, 0.0054, 0.0049],
          [0.0080, 0.0040, 0.0036],
          [0.0076, 0.0038, 0.0034]]

# Single RC (Thevenin) pair. tau = r_ohms * c_farad = 240 s.
# provenance: placeholder -- order-of-magnitude only, TODO fit. Lead-acid's dominant
# polarization time constant is MINUTES, not the ~20 s of a small lithium cell, because
# the process behind it is acid diffusion through the porous plates rather than a surface
# double layer. The long tau is why a lead-acid battery "recovers" visibly after a heavy
# load is removed. Note what this pair can and cannot do: it is a FIXED resistance, so it
# reproduces the relaxation transient but not the SOC-dependent depletion that drives real
# Peukert behaviour. The [diffusion] section below is that depletion, and the two are
# deliberately separated by two orders of magnitude in time constant -- 240 s here against
# 4218 s there -- so a rest of a few minutes clears this pair and leaves the other intact.
# That separation is what makes lead-acid's two-stage recovery legible: a quick bounce when
# the load comes off, and then hours of slow further recovery.
[[rc]]
r_ohms  = 0.0040
c_farad = 60000.0

# How the cell behaves below empty. Over-discharge is the classic way to kill a lead-acid
# battery -- deep discharge drives hard sulfation, and left flat the plates sulfate
# permanently. See docs/plans/low-clamp-reversal.md for what this section does.
[reversal]
# provenance: placeholder -- order-of-magnitude only, TODO fit. Sized the same way LFP's
# is: the cell collapses from its empty-endpoint OCV (1.95 V) to the floor over 2 % of
# capacity.
v_per_soc = 97.5
# provenance: placeholder -- a declared limit rather than a measured plateau, matching the
# choice made for LFP. A reversed lead-acid cell does go negative (the plates reverse
# polarity), but 0 V is the conservative bound and stops an otherwise unbounded ramp.
floor_v   = 0.0
# What over-discharge costs: capacity fraction lost per Ah delivered past empty.
# provenance: placeholder -- order-of-magnitude only, TODO fit. Sized against the collapse
# window above, the same way LFP's is, and set to cost TWICE what LFP's does per full
# reversal. Note the raw number is SMALLER than LFP's 2.2e-1 and still costs more, because
# it is per amp-hour on a cell three times the size -- compare the normalised quantity:
#   LFP:       2 % of 2.303 Ah = 0.0461 Ah past empty x 2.2e-1 = 1.0 % capacity lost
#   this cell: 2 % of 7.2   Ah = 0.1440 Ah past empty x 1.39e-1 = 2.0 % capacity lost
# The 2x is the intent: hard sulfation from a deep over-discharge is less recoverable than
# most lithium abuse, and lead-acid's reputation for dying after being left flat is the
# single most familiar fact about the chemistry.
fade_per_ah = 1.39e-1

# THE DEPLETING DIFFUSION OVERPOTENTIAL -- what makes this cell obey Peukert's law.
#
# One extra state per cell, the "depletion" D, which is the discharge current expressed as
# a C-rate and low-pass filtered with time constant tau_s:
#
#     D  <- D_ss + (D - D_ss) * exp(-dt/tau_s),   D_ss = I / capacity_ah
#     eta = -scale_v * ln(1 - D / (limit_c_rate * soc))
#
# Read that second line as: the cell can sustain limit_c_rate when full and proportionally
# less as it empties, because the ACID IS A REACTANT and a flat cell has less of it to
# move. Approaching that limit costs volts, and the volts are what trip the cut-off early.
# Dividing by soc is the whole mechanism -- three simpler forms were tried and all three
# lose exactly zero capacity below 0.5C, because nothing that grows with current alone can
# cost capacity at a rate where the current is small. See docs/plans/diffusion-overpotential.md.
#
# provenance: FITTED, all three, against this cell's own capacity-versus-rate curve --
# Peukert n = 1.1 (the AGM class) over 0.05C to 3C, WITH the absolute C/20 delivery in the
# objective rather than left as a free output. Not extracted from a parameter set, not
# taken from a paper: there is no PyBaMM lead-acid set to extract from. The fit is a grid
# search whose spacing is 22 % in scale_v, 18 % in limit_c_rate and 30 % in tau_s, so these
# are quoted to three figures and the fourth would be fiction.
#
# What the fit achieves, measured in the engine by crates/sim-data/tests/lead_acid_rate.rs:
# worst error against Peukert 3.3 points across the whole range, against 25.9 points for
# the same file with this section deleted (that arm is still run, as the control).
#
# What it does NOT achieve, stated because it is a real model error: the C/20 discharge
# delivers about 96.7 % of the 7.2 Ah declared above, not 100 %. The two would be the same
# number only if the cell emptied exactly at the 1.75 V cut-off, and it cannot -- eta
# diverges as soc -> 0 at ANY current, so the cell always stops a little short. capacity_ah
# is therefore the COULOMBIC capacity here and the datasheet's 7.2 Ah is a delivery; the
# 3.3 % between them is the gap this mechanism cannot close.
[diffusion]
# provenance: fitted (see above). 1.17 h. Physically this is acid diffusing through the
# pore structure of a thick plate, which is an HOURS process -- two orders of magnitude
# slower than the [[rc]] pair above and three above a lithium cell's double layer. It is
# independently checkable against rest-recovery data, which is the one thing the fit did
# NOT score: after a 3C discharge to cut-off and a four-hour rest this cell delivers
# materially more on a second discharge, and that falls out rather than being fitted.
tau_s        = 4218.0
# provenance: fitted (see above). The sustained C-rate a FULL cell could carry before the
# overpotential runs away; at state of charge s the limit is this times s. Compare
# max_discharge_c = 3.0 above, which is a datasheet continuous rating and not a diffusion
# limit -- a cell can be rated to deliver a current it cannot deliver for long.
limit_c_rate = 1.59
# provenance: fitted (see above), and DO NOT relabel this as thermodynamic. The form is
# Nernstian and the temptation is to read it as RT/nF = 25.7 mV; it is 2.6x that, because
# this one-state model has no separate charge-transfer term and this constant absorbs the
# electrode kinetics along with the concentration thermodynamics. Writing RT/F here would
# be a fabricated constant wearing a citation.
scale_v      = 0.0665
# provenance: DERIVED, not fitted and not chosen -- it is OCV(soc = 0) minus reversal.floor_v
# above, i.e. 1.950 - 0.0. That makes the two ways this engine can collapse a cell agree on
# where the bottom is: a saturated cell at rest sources exactly floor_v, the same place the
# reversal ramp takes a cell driven the whole way past empty. It binds only at soc = 0,
# where the limit above is zero and any depletion at all exhausts it; the largest
# overpotential reached anywhere in the 0.05C-3C sweep is a fifth of it, which the test
# asserts so that the rate fit rests on the mechanism and not on this number.
max_overpotential_v = 1.950

[thermal]
# provenance: ~m*cp for one cell of a 12 V 7.2 Ah AGM (~2.6 kg battery, ~430 g per cell,
# lead plates plus glass mat and acid, cp ~0.35 kJ/kg/K weighted); placeholder.
heat_capacity_j_per_k = 150.0
# h*A for a FULLY EXPOSED cell. Inside a pack the engine scales this down per cell by the
# fraction of surface not blocked by neighbours.
# provenance: natural-convection h*A placeholder for a bare prismatic cell of this size;
# larger than a cylindrical lithium cell's because the surface is larger.
h_area_w_per_k        = 0.55

# No docv_dt_v_per_k column, so entropic heating is disabled for this chemistry.
# (TODO: lead-acid's dU/dT is small and positive, ~+0.2 mV/K; add if the reversible term
# ever matters here.)

# Semi-empirical aging. Same model as the lithium files: calendar fade is k(T, soc)*sqrt(t),
# cycle fade is per Ah of throughput weighted by depth. Every number is a placeholder, but
# the SET is chosen to put lead-acid where it actually sits relative to lithium: far fewer
# cycles, and calendar life dominated by grid corrosion which is strongly temperature-driven.
# Together these give roughly 20 % capacity fade over a year at 25 degC held full, and
# roughly 20 % over 300 full cycles -- i.e. a few hundred deep cycles rather than lithium's
# few thousand, which is the honest headline for this chemistry.
#
# NOTE ON A SIGN THIS MODEL CANNOT EXPRESS: lead-acid's calendar fade is worst when the cell
# is left DISCHARGED (sulfation), the opposite of lithium, which is worst held full. The
# cal_soc_stress table below is written that way -- higher stress at low SOC -- which is a
# use of the existing knob, not a change to it.
[aging]
cal_pre_exp                = 4.0e4    # provenance: placeholder -- order-of-magnitude only, TODO fit
cal_ea_j_per_mol           = 5.5e4    # provenance: placeholder Arrhenius activation energy for grid corrosion, TODO fit
cal_soc_stress             = [1.8, 1.0, 1.1]  # provenance: placeholder stress at soc = 0.0/0.5/1.0, INVERTED relative to lithium because a lead-acid cell left flat sulfates
cyc_fade_per_ah            = 1.0e-4   # provenance: placeholder, set ~5x the LFP file's so a few hundred deep cycles rather than a few thousand, TODO fit
cyc_dod_stress_exp         = 1.3      # provenance: placeholder DOD stress exponent; lead-acid cycle life is far more depth-sensitive than lithium's, which is why deep-cycle use is rated separately
r_growth_per_capacity_loss = 2.0      # provenance: placeholder -- resistance growth outruns capacity fade, more so than lithium because grid corrosion attacks the conduction path directly

# [safety] IS DELIBERATELY OMITTED, and the omission is the correct physics.
#
# The section is optional. Its live half models LITHIUM PLATING -- charging a cold cell
# above a C-rate threshold deposits metallic lithium, costing capacity and risking a soft
# internal short. A lead-acid cell has no lithium and no such mechanism, so every constant
# in that half would be a fabricated number in a repo whose rule is that there are none.
#
# Lead-acid does have a real thermal runaway, but it is a DIFFERENT mechanism from the one
# the runaway trio models: it happens during constant-voltage charging, when a hot cell
# draws more current, which makes it hotter, which makes it draw more -- an electrical
# feedback loop through the charger, not an internal exothermic decomposition with a finite
# energy budget. Filling in t_onset_k / t_vent_k / runaway_energy_j would describe the wrong
# failure. Modelling the real one needs the charger in the loop and is out of scope.
