[package]
name = "sim-data"
version = "0.0.0"
description = "TOML chemistry-parameter loading and validation for sim-core."
edition.workspace = true
license-file.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
sim-core = { path = "../sim-core" }
serde = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# The wire-format round-trip tests. `float_roundtrip` comes from the workspace
# entry and is the whole point of it — see the comment there. sim-data rather than
# sim-core hosts these because the probe needs a real chemistry off disk to produce
# full-mantissa floats, and reading files is exactly what this crate is for.
serde_json = { workspace = true }
# The SPM-vs-ECM step benchmark (see benches/spm_pack_step.rs). It lives here
# rather than beside sim-core's `pack_step` bench for one reason: it prices the
# *shipped* LG M50 chemistry, whose `[spm]` section is 130 numbers and two OCP
# tables. sim-core cannot read a file, so a bench there would have to hand-copy all
# of it — and a hand-copied parameter set is a benchmark of a typo waiting to
# happen. Same flags as sim-core's entry, for the same reasons.
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
# `tests/path_claims.rs` reads web/path-claims.toml. `toml` is already a normal
# dependency of this crate, but integration tests do not inherit those, so it is named
# again here — it adds nothing to the dependency graph.
toml = { workspace = true }
# The same test deserializes that claims file. Same reasoning as `toml` above.
serde = { workspace = true }

# Criterion supplies its own harness, so libtest's must be off.
[[bench]]
name = "spm_pack_step"
harness = false

[[bench]]
name = "dfn_pack_step"
harness = false
