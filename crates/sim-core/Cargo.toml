[package]
name = "sim-core"
version = "0.0.0"
description = "Pure, deterministic battery-pack simulation engine (no I/O, no async, no globals)."
edition.workspace = true
license-file.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
serde = { workspace = true }
rand_chacha = { workspace = true }
rand_core = { workspace = true }
bitflags = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# Byte-exact serde format for the snapshot bit-identical replay test. Dev-only:
# the engine never depends on a concrete serialization format (adapters choose).
bincode = "1.3"
# `Pack::step` benchmarks (see benches/pack_step.rs). Default features (HTML
# reports, plotting) are off: the numbers are read from the CLI, and the lighter
# dev graph keeps `cargo test -p sim-core` — the fast inner loop — cheap.
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
# Property-based testing of the invariants (charge conservation, SOC bounds, …).
proptest = "1"

# Criterion supplies its own harness (`--bench` CLI, sampling, statistics), so
# libtest's must be off.
[[bench]]
name = "pack_step"
harness = false
