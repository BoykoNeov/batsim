[package]
name = "sim-wasm"
version = "0.0.0"
description = "wasm-bindgen build of sim-core for the browser pedagogy client."
edition.workspace = true
license-file.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true

# `cdylib` is what `wasm-pack` links; `rlib` is what makes `engine` reachable from
# `tests/`, which is where every assertion in this crate lives. Dropping `rlib` would
# leave the crate untestable on the host target, and this crate deliberately stays
# inside `cargo test --workspace`.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
sim-core = { path = "../sim-core" }
# `sim-data` compiles for wasm32 as-is: `std::fs` builds on that target and merely
# fails at runtime, so this crate can depend on the whole thing and simply never call
# `load_chemistry_file`. Checked with `cargo check -p sim-data --target
# wasm32-unknown-unknown`. If that ever stops being true, the fix is a
# `#[cfg(not(target_arch = "wasm32"))]` on that one function, not a new crate.
sim-data = { path = "../sim-data" }
serde = { workspace = true }
# `{ workspace = true }` is load-bearing, not tidiness: the workspace entry carries
# `float_roundtrip`, and writing `serde_json = "1"` here would compile perfectly while
# silently dropping it. This crate hands snapshot JSON to a page that hands it back,
# so it is squarely a consumer. See the comment on the workspace dependency.
serde_json = { workspace = true }
thiserror = { workspace = true }
# The only browser-facing dependency. No `js-sys`/`web-sys`: everything crosses the
# boundary as a string or a number, which is also what keeps `engine` testable on the
# host target without a JS runtime anywhere.
wasm-bindgen = "0.2"
